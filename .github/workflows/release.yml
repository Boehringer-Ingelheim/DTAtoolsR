name: Build and Attach R Package

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to build and attach the tarball to'
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ github.event.release.tag_name || github.event.inputs.tag }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ env.TAG }}

      - uses: r-lib/actions/setup-pandoc@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2.14.0

      - uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2.14.0
        with:
          r-version: release
          http-user-agent: release
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2.14.0
        with:
          extra-packages: any::remotes
          needs: build
          use-public-rspm: true

      - name: Build package
        run: |
          R CMD build .
          FILENAME=$(ls DTAtools_*.tar.gz)
          echo "FILENAME=${FILENAME}" >> $GITHUB_ENV

      - name: Check version
        run: |
          VERSION=$(echo $FILENAME | sed 's/.*_\(.*\).tar.gz/\1/')
          if [ "v${VERSION}" != "${TAG}" ]; then
            echo "Version mismatch. Tag version and package version should be the same."
            exit 1
          fi

      - name: Attach tarball to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${TAG}" "./${FILENAME}" --clobber --repo "${{ github.repository }}"
