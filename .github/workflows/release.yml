name: Build and Attach R Package

on:
  release:
    types: [created]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          http-user-agent: release
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::remotes
          needs: build
          use-public-rspm: true

      - name: Build package
        run: |
          R CMD build .
          FILENAME=$(ls DTAtools_*.tar.gz)
          echo "FILENAME=${FILENAME}" >> $GITHUB_ENV

      - name: Check version
        run: |
          VERSION=$(echo $FILENAME | sed 's/.*_\(.*\).tar.gz/\1/')
          if [ "v${VERSION}" != "${GITHUB_REF#refs/tags/}" ]; then
            echo "Version mismatch. Tag version and package version should be the same."
            exit 1
          fi

      - name: Attach tarball to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          gh release upload "${TAG}" "./${FILENAME}" --clobber --repo "${{ github.repository }}"
