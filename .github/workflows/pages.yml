name: Deploy GitHub Pages

# Deploys from master, not dev, for two reasons that both have to hold:
#
#   * The `github-pages` environment carries a deployment branch policy that
#     permits `master` alone. A run triggered from `dev` is rejected by the
#     environment before any step executes, which surfaces as a failed job with
#     no failed step -- the state this workflow was in from the day it was
#     added until the first change to docs/ actually triggered it.
#   * The repository's Pages source is configured as `master`.
#
# It also gives the right behaviour: the published tutorial tracks what has
# been released, rather than whatever is currently in development.
on:
  push:
    branches: [master]
    paths:
      - docs/**
  workflow_dispatch:

# Required for pages deployment
permissions:
  contents: read
  pages: write
  id-token: write

# Only one concurrent deployment; cancel in-progress runs
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v5

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
