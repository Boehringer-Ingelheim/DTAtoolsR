# Line coverage of R/ by the test suite, measured with covr.
#
# Requirement coverage (inst/qualification) says every requirement has a test;
# it cannot say which branches of the code those tests actually execute. This
# workflow does: the total and a per-file table go to the job summary, and the
# list of never-executed lines is uploaded as an artifact.
#
# The run fails when coverage drops below `COVERAGE_FLOOR`. The baseline measured
# on 2026-11-04 (Windows, R 4.5.1) was 87.5%; the floor sits 2.5 points under
# it to absorb platform-specific branches. Raise it as coverage rises -- a floor
# far below the real figure guards nothing.
#
# Not measured: the Shiny app under inst/shiny. covr's package coverage
# instruments R/ only, and the app is sourced at launch rather than built into
# the package. Its helpers are unit tested through the app_env() harness in
# tests/testthat/helper-shinyapp.R.

name: test-coverage

on:
  pull_request:
    branches: [master, dev]
  push:
    branches: [dev]
  workflow_dispatch:

permissions: read-all

jobs:
  coverage:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      # Same reason as in R-CMD-check.yaml: this package is not on CRAN, and the
      # skip_on_cran() tests are among the ones that matter most.
      NOT_CRAN: true
      COVERAGE_FLOOR: "85"

    steps:
      - uses: actions/checkout@v5

      - uses: r-lib/actions/setup-pandoc@v2.12.1

      # The PDF export test needs a DOCX -> PDF backend, exactly as in
      # R-CMD-check.yaml; without one it skips and its code reads as uncovered.
      - uses: r-lib/actions/setup-tinytex@v2.12.1

      - uses: r-lib/actions/setup-r@v2.12.1
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2.12.1
        with:
          extra-packages: any::covr, any::xml2
          needs: coverage
          use-public-rspm: true

      - name: Measure coverage
        shell: Rscript {0}
        run: |
          lib <- file.path(getwd(), "covr-lib")
          dir.create(lib, showWarnings = FALSE)
          cov <- covr::package_coverage(
            type = "tests", quiet = FALSE, clean = FALSE, install_path = lib
          )
          saveRDS(cov, "coverage.rds")
          total <- covr::percent_coverage(cov)
          per_file <- sort(covr::coverage_to_list(cov)$filecoverage)
          zero <- covr::zero_coverage(cov)
          utils::write.csv(zero, "zero-coverage.csv", row.names = FALSE)

          summary_file <- Sys.getenv("GITHUB_STEP_SUMMARY")
          lines <- c(
            sprintf("## Line coverage of R/: %.2f%%", total),
            "",
            sprintf("%d lines are never executed by any test (see the zero-coverage artifact).", nrow(zero)),
            "",
            "| File | Coverage |",
            "| --- | ---: |",
            sprintf("| %s | %.1f%% |", names(per_file), per_file)
          )
          if (nzchar(summary_file)) write(lines, summary_file, append = TRUE)
          cat(lines, sep = "\n")

          floor <- suppressWarnings(as.numeric(Sys.getenv("COVERAGE_FLOOR")))
          if (!is.na(floor) && total < floor) {
            stop(sprintf("Coverage %.2f%% is below the floor of %.2f%%.", total, floor))
          }

      # A test that fails only under instrumentation leaves its log in the
      # library covr installed into; keep it, or the failure is unexplained.
      - name: Upload coverage results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: |
            zero-coverage.csv
            covr-lib/**/testthat.Rout*
          if-no-files-found: ignore
          retention-days: 30
