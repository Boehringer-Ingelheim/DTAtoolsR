# Line coverage of R/ by the test suite, measured with covr.
#
# Requirement coverage (inst/qualification) says every requirement has a test;
# it cannot say which branches of the code those tests actually execute. This
# workflow does: the total and a per-file table go to the job summary, and the
# list of never-executed lines is uploaded as an artifact.
#
# The run fails when coverage drops below `COVERAGE_FLOOR`. The baseline measured
# on 2026-11-04 (Windows, R 4.5.1) was 87.5%; the floor sits 2.5 points under
# it to absorb platform-specific branches. Raise it as coverage rises -- a floor
# far below the real figure guards nothing.
#
# Not measured: the Shiny app under inst/shiny. covr's package coverage
# instruments R/ only, and the app is sourced at launch rather than built into
# the package. Its helpers are unit tested through the app_env() harness in
# tests/testthat/helper-shinyapp.R.

# TIERS (decided by ci-tier.yml, shared with R-CMD-check.yaml): both jobs are
# skipped on a pull request into dev, and run -- with their floors -- on a pull
# request into master, one labelled `full-ci`, a manual dispatch, and the
# nightly schedule on dev. A pull request whose every path is inert for R CMD
# check skips them on any tier: no line of R/ can have changed. There is no
# `push: dev` trigger; the nightly run covers dev.

name: test-coverage

on:
  pull_request:
    branches: [master, dev]
    # `labeled` so that adding `full-ci` runs coverage at once.
    types: [opened, synchronize, reopened, labeled]
  schedule:
    # Nightly, on dev (must match the checkout `ref:` below).
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions: read-all

concurrency:
  group: test-coverage-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  changes:
    uses: ./.github/workflows/ci-tier.yml

  coverage:
    needs: changes
    # Negated comparisons and `!cancelled()`: a failed tier job runs coverage
    # rather than skipping it; see ci-tier.yml.
    if: >-
      ${{ !cancelled() && needs.changes.outputs.tier != 'fast'
      && needs.changes.outputs.skip != 'true' }}
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      # Same reason as in R-CMD-check.yaml: this package is not on CRAN, and the
      # skip_on_cran() tests are among the ones that matter most.
      NOT_CRAN: true
      COVERAGE_FLOOR: "85"

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event_name == 'schedule' && 'dev' || '' }}

      - uses: r-lib/actions/setup-pandoc@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2.12.1

      # The PDF export test needs a DOCX -> PDF backend, exactly as in
      # R-CMD-check.yaml; without one it skips and its code reads as uncovered.
      - uses: r-lib/actions/setup-tinytex@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2.12.1

      - uses: r-lib/actions/setup-r@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2.12.1
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2.12.1
        with:
          extra-packages: any::covr, any::xml2, any::rstudioapi
          needs: coverage
          use-public-rspm: true

      - name: Measure coverage
        shell: Rscript {0}
        run: |
          lib <- file.path(getwd(), "covr-lib")
          dir.create(lib, showWarnings = FALSE)
          cov <- covr::package_coverage(
            type = "tests", quiet = FALSE, clean = FALSE, install_path = lib
          )
          saveRDS(cov, "coverage.rds")
          total <- covr::percent_coverage(cov)
          per_file <- sort(covr::coverage_to_list(cov)$filecoverage)
          zero <- covr::zero_coverage(cov)
          utils::write.csv(zero, "zero-coverage.csv", row.names = FALSE)

          summary_file <- Sys.getenv("GITHUB_STEP_SUMMARY")
          lines <- c(
            sprintf("## Line coverage of R/: %.2f%%", total),
            "",
            sprintf("%d lines are never executed by any test (see the zero-coverage artifact).", nrow(zero)),
            "",
            "| File | Coverage |",
            "| --- | ---: |",
            sprintf("| %s | %.1f%% |", names(per_file), per_file)
          )
          if (nzchar(summary_file)) write(lines, summary_file, append = TRUE)
          cat(lines, sep = "\n")

          floor <- suppressWarnings(as.numeric(Sys.getenv("COVERAGE_FLOOR")))
          if (!is.na(floor) && total < floor) {
            stop(sprintf("Coverage %.2f%% is below the floor of %.2f%%.", total, floor))
          }

      # A test that fails only under instrumentation leaves its log in the
      # library covr installed into; keep it, or the failure is unexplained.
      - name: Upload coverage results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage
          path: |
            zero-coverage.csv
            covr-lib/**/testthat.Rout*
          if-no-files-found: ignore
          retention-days: 30

  # Line coverage of R/ by the qualification suite ALONE: which code the
  # requirement-traced IQ/OQ/PQ cases execute. Unit tests are kept out
  # (include_unit_tests = "never") because they are not traced to requirements,
  # so counting them would claim evidence the qualification does not hold.
  #
  # The denominator is product code. The runner itself and the app launcher /
  # benchmark helpers are excluded here (and only here: the job above keeps its
  # own denominator); running the runner is the IQ and OQ-CORE evidence, not
  # something the suite tests. The scope is stated in validation-plan.md 4b.
  #
  # Baseline 2026-11-05 (Windows, R 4.5.1, quick tier): 75.5%. The floor sits
  # 2.5 points under it and ratchets up as thoughts/shared/plans/
  # PLAN-qualification-coverage.md is worked through (85, 92, 95).
  qualification-coverage:
    needs: changes
    if: >-
      ${{ !cancelled() && needs.changes.outputs.tier != 'fast'
      && needs.changes.outputs.skip != 'true' }}
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      COVERAGE_FLOOR: "73"

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event_name == 'schedule' && 'dev' || '' }}

      - uses: r-lib/actions/setup-pandoc@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2.12.1

      - uses: r-lib/actions/setup-r@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2.12.1
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2.12.1
        with:
          # covr loads rstudioapi at the end of package_coverage(); without it
          # the run measures everything and then dies (as in the job above).
          extra-packages: any::covr, any::rstudioapi
          needs: coverage
          use-public-rspm: true

      - name: Measure qualification coverage
        shell: Rscript {0}
        run: |
          lib <- file.path(getwd(), "covr-lib")
          out <- file.path(getwd(), "qualification-output")
          dir.create(lib, showWarnings = FALSE)
          # No try(): a run that crashes must fail this job, not report the
          # coverage of whatever ran before the crash.
          code <- sprintf(
            paste0(
              'DTAtools::run_qualification("%s", scale = "quick", formats = "md", ',
              'include_unit_tests = "never", tester = "test-coverage workflow")'
            ),
            out
          )
          excluded <- c(
            "R/qualification.R", "R/qualification-report.R",
            "R/run_dta_app.R", "R/benchmarking.R"
          )
          cov <- covr::package_coverage(
            type = "none", code = code, quiet = FALSE, clean = FALSE,
            install_path = lib, line_exclusions = as.list(excluded)
          )
          total <- covr::percent_coverage(cov)
          per_file <- sort(covr::coverage_to_list(cov)$filecoverage)
          zero <- covr::zero_coverage(cov)
          utils::write.csv(zero, "qualification-zero-coverage.csv", row.names = FALSE)

          summary_file <- Sys.getenv("GITHUB_STEP_SUMMARY")
          lines <- c(
            sprintf("## Line coverage of R/ by the qualification suite alone: %.2f%%", total),
            "",
            sprintf("Excluded from the denominator: %s.", paste(excluded, collapse = ", ")),
            sprintf("%d lines are executed by no qualification case (see the artifact).", nrow(zero)),
            "",
            "| File | Coverage |",
            "| --- | ---: |",
            sprintf("| %s | %.1f%% |", names(per_file), per_file)
          )
          if (nzchar(summary_file)) write(lines, summary_file, append = TRUE)
          cat(lines, sep = "\n")

          floor <- suppressWarnings(as.numeric(Sys.getenv("COVERAGE_FLOOR")))
          if (!is.na(floor) && total < floor) {
            stop(sprintf("Qualification coverage %.2f%% is below the floor of %.2f%%.", total, floor))
          }

      - name: Upload qualification coverage results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: qualification-coverage
          path: |
            qualification-zero-coverage.csv
            qualification-output/**/SUMMARY.txt
            qualification-output/**/run.log
          if-no-files-found: ignore
          retention-days: 30
