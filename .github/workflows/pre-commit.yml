# Pull requests only: the autofix step below pushes to `github.head_ref`, which
# is empty outside a `pull_request` event, so a push-triggered run could never
# commit anything. Branches are master/dev — this workflow previously listed
# `main`, which does not exist here, so it never ran at all.
on:
  pull_request:
    branches: [master, dev]
  workflow_dispatch:

name: pre-commit

concurrency:
  group: pre-commit-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  pre-commit:
    permissions:
      # Give the default GITHUB_TOKEN write permission to commit and push the
      # added or changed files to the repository.
      contents: write
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref }}
          # A fork's branch does not exist in the base repository.
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.x"

      # No R setup here: every remaining hook is pure Python. The R-specific
      # checks (styler, roxygen2/NAMESPACE, deps-in-desc, ...) run in the
      # separate r-style workflow, against the project's own R library
      # instead of a second one built just for this job.

      # Not pre-commit/action@vN: that composite action bakes its own
      # actions/cache step in with no continue-on-error, so a cache-service
      # outage (as happened here) fails the job before a single hook runs. A
      # cache miss/outage must only make the run slower, never fail it, so the
      # cache step is inlined here where we control that.
      - name: Cache pre-commit envs
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        continue-on-error: true
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-3|${{ env.pythonLocation }}|${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Install pre-commit
        run: python -m pip install pre-commit

      - name: Run pre-commit
        run: pre-commit run --show-diff-on-failure --color=always --all-files

      # A fork PR cannot be pushed to with the base repository's token.
      - uses: stefanzweifel/git-auto-commit-action@b863ae1933cb653a53c021fe36dbb774e1fb9403 # v5
        if: ${{ !cancelled() && github.event.pull_request.head.repo.full_name == github.repository }}
        with:
          commit_message: pre-commit autofixes
