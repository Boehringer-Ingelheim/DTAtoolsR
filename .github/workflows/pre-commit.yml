# Pull requests only: the autofix step below pushes to `github.head_ref`, which
# is empty outside a `pull_request` event, so a push-triggered run could never
# commit anything. Branches are master/dev — this workflow previously listed
# `main`, which does not exist here, so it never ran at all.
on:
  pull_request:
    branches: [master, dev]
  workflow_dispatch:

name: pre-commit

concurrency:
  group: pre-commit-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  pre-commit:
    permissions:
      # Give the default GITHUB_TOKEN write permission to commit and push the
      # added or changed files to the repository.
      contents: write
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::roxygen2
          needs: roxygen2

      # Not pre-commit/action@vN: that composite action bakes its own
      # actions/cache step in with no continue-on-error, so a cache-service
      # outage (as happened here) fails the job before a single hook runs. A
      # cache miss/outage must only make the run slower, never fail it, so the
      # cache step is inlined here where we control that.
      - name: Cache pre-commit envs
        uses: actions/cache@v4
        continue-on-error: true
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-3|${{ env.pythonLocation }}|${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Install pre-commit
        run: python -m pip install pre-commit

      - name: Run pre-commit
        run: pre-commit run --show-diff-on-failure --color=always --all-files

      - uses: stefanzweifel/git-auto-commit-action@v5
        if: '!cancelled()'
        with:
          commit_message: pre-commit autofixes
