# Runs the qualification suite against an installed package.
#
# A real qualification run happens by hand on the target system: that is the
# whole point of it, and its evidence bundle is the deliverable. What runs here
# keeps the suite from rotting unnoticed between deployments, exercised against
# an *installed* package rather than only against a source tree on one
# developer's machine. tests/testthat/test-qualification.R, the one check in the
# developer suite, calls the runner with `stages = character(0)` and so executes
# none of the OQ/PQ cases; this workflow is where they run in CI.
#
# TIERS (decided by ci-tier.yml, shared with R-CMD-check.yaml):
#   fast    a pull request into dev: the quick scale on ubuntu only, and only
#           when the diff touches R/, inst/, tests/, DESCRIPTION or NAMESPACE.
#   release a pull request into master, one labelled `full-ci`, a manual
#           dispatch, or the nightly schedule: the standard scale on Linux,
#           Windows and macOS.
#
# No `push: dev` trigger: the pull request run already tested the merge commit
# that lands on dev, and the nightly run covers dev as a whole. The schedule
# runs master's copy of this file, so it checks out dev explicitly. A
# `pull_request` run uses the pull request's own copy of this file.

name: qualification

on:
  pull_request:
    branches: [dev, master]
    # `labeled` so that adding `full-ci` re-runs at the release tier at once.
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:
    inputs:
      scale:
        description: Scale tier
        required: false
        default: standard
        type: choice
        options: [quick, standard, full]
  schedule:
    # Nightly, on dev (must match the checkout `ref:` below).
    - cron: "0 2 * * *"

permissions:
  contents: read
  # ci-tier.yml lists the pull request's files.
  pull-requests: read

concurrency:
  group: qualification-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  changes:
    uses: ./.github/workflows/ci-tier.yml

  qualify:
    needs: changes
    # `!cancelled()` and the negated comparisons make a failed tier job run
    # everything rather than nothing; see ci-tier.yml.
    if: >-
      ${{ !cancelled() && (needs.changes.outputs.tier != 'fast'
      || needs.changes.outputs.code != 'false') }}
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.changes.outputs.tier != 'fast' && '["ubuntu-latest","windows-latest","macos-latest"]' || '["ubuntu-latest"]') }}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      SCALE: ${{ inputs.scale || (needs.changes.outputs.tier != 'fast' && 'standard' || 'quick') }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event_name == 'schedule' && 'dev' || '' }}

      - uses: r-lib/actions/setup-pandoc@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2
        with:
          pandoc-version: "3.10.1"

      - uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2
        with:
          r-version: release
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2
        with:
          extra-packages: |
            any::rcmdcheck
            any::testthat
            any::R6
          needs: check

      # --install-tests so the run can report the developer suite as
      # supplementary evidence, and --build so the installation writes a
      # checksum manifest into the library for the installation stage to
      # verify the installed files against. Neither is required and neither
      # changes the verdict; both make the run cover more.
      - name: Install the package
        run: R CMD INSTALL --install-tests --build .
        shell: bash

      # One line on purpose: Rscript on Windows cuts a multi-line -e at the
      # first newline.
      - name: Run the qualification
        run: Rscript -e 'DTAtools::run_qualification("qualification-output", scale = Sys.getenv("SCALE"), tester = "GitHub Actions ${{ matrix.os }}")'
        shell: bash

      # Uploaded before the verdict is enforced, so a failing run still leaves
      # the evidence that explains why it failed.
      - name: Upload the evidence bundle
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: qualification-${{ matrix.os }}
          path: qualification-output
          retention-days: 30

      - name: Fail on a FAIL verdict
        if: always()
        run: Rscript .github/scripts/qualification_verdict.R
        shell: bash
