# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
#
# Triggers deliberately exclude `push`. A `pull_request` run checks the
# *merge commit* (refs/pull/N/merge), which is byte-for-byte what lands on the
# target branch, so re-running on the subsequent push to master — or on the
# master -> dev back-merge — would check the same tree two or three more times.
# The PR run is the gate; make it a required check in branch protection.
# Direct pushes (release-only commits on master) are covered by the weekly
# schedule, which also catches breakage from CRAN dependency updates.
#
# WHY THE SKIP BELOW IS A JOB-LEVEL CONDITIONAL AND NOT `paths-ignore`. Some
# pull requests cannot possibly change what `R CMD check` reports. The
# release-finishing pin is four lines of inst/shiny/dta_app/manifest.json, and
# #124 spent 91 minutes of matrix time establishing that four lines of JSON had
# not broken the package on five platforms. The obvious fix -- a `paths-ignore`
# on the trigger above -- is not merely imperfect here, it is worse than the
# waste. The five matrix legs are required status checks in the `master`
# ruleset, and a workflow skipped by path filtering never reports its contexts
# at all: they sit at Pending and the pull request can never be merged. Since
# every release ends in a manifest-only PR into master, that would deadlock the
# release process itself.
#
# GitHub's documented escape is the opposite mechanism -- "if a job within a
# workflow is skipped due to a conditional, it will report its status as
# 'Success'". So the workflow keeps triggering on every pull request, and the
# `changes` job below decides per diff whether the matrix has anything to do.
on:
  pull_request:
    branches: [master, dev]
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

name: R-CMD-check

permissions: read-all

# Superseded PR pushes cancel the still-running matrix instead of queueing a
# second full one. Non-PR runs fall back to run_id, which is unique per run, so
# a manual dispatch can never cancel an in-flight scheduled run (they would
# otherwise share the constant group "refs/heads/master").
concurrency:
  group: R-CMD-check-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  # Decides whether this diff can affect `R CMD check` at all. No checkout and
  # no R, so it costs seconds; see the header for why the answer is spent on a
  # job-level `if` rather than on `paths-ignore`.
  #
  # The list below is an ALLOWLIST, and that direction is the whole safety
  # argument: a path has to be named here to be treated as inert, so a file
  # nobody has classified runs the full matrix by default. Most entries are
  # ones `.Rbuildignore` already keeps out of the built tarball -- ^docs$,
  # ^thoughts$, ^\.claude$, ^CLAUDE\.md$, ^CLAUDE\.local\.md$ and the
  # unanchored CHANGELOG.md line -- so the check never sees them at all. Two
  # entries do ship, and have to earn their place on different grounds:
  #
  #   inst/shiny/dta_app/manifest.json is a Posit Connect deployment
  #   descriptor, consumed entirely outside the package: nothing in R/,
  #   inst/shiny/dta_app/, tests/, man/ or vignettes/ reads it, and no roxygen
  #   example or vignette chunk mentions it. The thing that actually validates
  #   it is check_manifest.R, which runs in r-style.yaml -- gated by none of
  #   this, and still running on every pull request. So a manifest-only PR is
  #   still fully checked by the workflow that can meaningfully check it, and
  #   only by that one.
  #
  #   README.md is read by `R CMD check` only under --as-cran, and only to be
  #   scanned for URLs, which is reported as a NOTE. check-r-package defaults
  #   to error-on: "warning", so a NOTE cannot fail this build. The worst a
  #   README-only pull request can hide is a newly broken link, and that
  #   surfaces again on the next pull request touching anything else, and on
  #   the weekly scheduled run.
  #
  # .github/** is deliberately NOT here: a change to this very file, or to a
  # script a workflow sources, must re-run the matrix.
  changes:
    runs-on: ubuntu-latest

    outputs:
      skip: ${{ steps.classify.outputs.skip }}

    steps:
      # Every branch below writes `skip`, and everything that is not a
      # confident "none of this matters" writes skip=false. Failing toward
      # running the check is the only acceptable direction for this job to be
      # wrong in.
      - name: Decide whether this diff can affect R CMD check
        id: classify
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -uo pipefail

          # The weekly schedule and a manual dispatch have no diff to classify.
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "Event is '$EVENT_NAME', not a pull request; running the full matrix."
            echo "skip=false" >>"$GITHUB_OUTPUT"
            exit 0
          fi

          # One line per changed file, as "<new path>[TAB]<old path>".
          #
          # The REST field is `filename`; `path` is gh's own normalisation in
          # `gh pr view --json files` and comes back empty from `gh api`.
          #
          # `previous_filename` is present only on a rename, and classifying it
          # too is what stops the one input that would otherwise skip wrongly:
          # `git mv R/foo.R thoughts/archive/foo.R` reports only the inert NEW
          # path, so judging that alone would skip the matrix on a pull request
          # that had just deleted an R source file.
          if ! entries=$(gh api "repos/$REPO/pulls/$PR_NUMBER/files" --paginate \
                           --jq '.[] | [.filename, (.previous_filename // empty)] | @tsv'); then
            echo "::warning::Could not list files in PR #$PR_NUMBER; running the full matrix."
            echo "skip=false" >>"$GITHUB_OUTPUT"
            exit 0
          fi

          if [ -z "$entries" ]; then
            echo "::warning::PR #$PR_NUMBER reported no changed files; running the full matrix."
            echo "skip=false" >>"$GITHUB_OUTPUT"
            exit 0
          fi

          # That endpoint "include[s] a maximum of 3000 files" and says nothing
          # when it truncates, so a very large pull request could present an
          # all-inert prefix of a diff that is not. Ask the pull request itself
          # how many files it changed, and refuse to judge a list that does not
          # account for every one of them.
          if ! declared=$(gh api "repos/$REPO/pulls/$PR_NUMBER" --jq '.changed_files'); then
            echo "::warning::Could not read changed_files for PR #$PR_NUMBER; running the full matrix."
            echo "skip=false" >>"$GITHUB_OUTPUT"
            exit 0
          fi

          listed=$(printf '%s\n' "$entries" | wc -l | tr -d '[:space:]')
          if [ "$listed" != "$declared" ]; then
            echo "::warning::PR #$PR_NUMBER declares $declared changed files but $listed were listed; running the full matrix."
            echo "skip=false" >>"$GITHUB_OUTPUT"
            exit 0
          fi

          # A herestring, not a pipe: a pipe would run the loop in a subshell
          # and `skip=false` would not survive it.
          skip=true
          while IFS=$'\t' read -r new_path old_path; do
            for file in "$new_path" "$old_path"; do
              if [ -z "$file" ]; then
                continue
              fi
              case "$file" in
                inst/shiny/dta_app/manifest.json) ;;
                docs/*|thoughts/*|.claude/*) ;;
                CLAUDE.md|CLAUDE.local.md|README.md|CHANGELOG.md) ;;
                *)
                  echo "'$file' can affect R CMD check; running the full matrix."
                  skip=false
                  break 2
                  ;;
              esac
            done
          done <<<"$entries"

          if [ "$skip" = true ]; then
            echo "Every changed path is inert for R CMD check; skipping the matrix:"
            printf '%s\n' "$entries" | sed 's/^/  /'
          fi
          echo "skip=$skip" >>"$GITHUB_OUTPUT"

  R-CMD-check:
    needs: changes

    # `!= 'true'`, not `== 'false'`: the default is to run, so an unexpected
    # output value -- or none at all -- still runs the matrix.
    #
    # `!cancelled()` is load-bearing rather than decorative. A job with `needs`
    # whose `if` contains no status function is skipped outright when its
    # dependency fails, and a skipped leg reports Success to the ruleset. So
    # without it, a transient failure in `changes` would silently satisfy all
    # five required checks having verified nothing. With it, a failed `changes`
    # leaves `skip` empty, the condition holds, and the matrix runs.
    if: ${{ !cancelled() && needs.changes.outputs.skip != 'true' }}

    runs-on: ${{ matrix.config.os }}

    # These five strings ARE the required status check contexts named in the
    # `master` ruleset. Renaming a leg silently un-gates it.
    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: macos-latest,   r: 'release'}
          - {os: windows-latest, r: 'release'}
          - {os: ubuntu-latest,   r: 'devel', http-user-agent: 'release'}
          - {os: ubuntu-latest,   r: 'release'}
          - {os: ubuntu-latest,   r: 'oldrel-1'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v5

      - uses: r-lib/actions/setup-pandoc@v2.12.1

      # PDF export (write_dta(format = "pdf")) converts the generated DOCX with
      # an external engine. Without one installed here the end-to-end PDF test
      # would skip on every runner and prove nothing; the companion guard in
      # tests/testthat/test-exportDocuments.R fails the build if this step is
      # ever dropped. TinyTeX is used because it is what the package tells users
      # to install, so CI exercises the documented remedy. Adds ~1 min per leg.
      - uses: r-lib/actions/setup-tinytex@v2.12.1

      - uses: r-lib/actions/setup-r@v2.12.1
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2.12.1
        with:
          extra-packages: any::rcmdcheck,any::remotes
          needs: check
          use-public-rspm: true

      # Fails fast, and with a readable message, if the PDF toolchain above did
      # not actually land — otherwise the only symptom is a test failure deep in
      # the check log.
      - name: Verify a DOCX -> PDF backend is present
        shell: Rscript {0}
        run: |
          pkgload::load_all(".", quiet = TRUE)
          backend <- dta_pdf_backend()
          if (is.null(backend)) {
            stop("No DOCX -> PDF backend on this runner; setup-tinytex did not take effect.")
          }
          cat("PDF backend:", backend$name, "| engine:", backend$engine, "\n")

      - uses: r-lib/actions/check-r-package@v2.12.1
        with:
          upload-snapshots: true
          build_args: 'c("--no-manual","--compact-vignettes=gs+qpdf")'
