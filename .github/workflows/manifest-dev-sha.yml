# Keep the Shiny app manifest's DTAtools RemoteSha/GithubSHA1 pointing at the tip
# of `dev`, so the Connect instance that deploys `dev` installs the DTAtools code
# that is actually on `dev`.
#
# Why this exists. Posit Connect builds a `Source: "github"` package's archive
# download URL from GithubSHA1. With no SHA the URL is empty and the deploy dies
# in Connect's installer on `if (!grepl("^http", archiveUrl))` --
# "argument is of length zero" -- before anything else is attempted.
#
# `dev` had no SHA at all, and a GithubRef of `v0.20.0` naming a tag that was
# never cut, because bump_version.R used to assume the only deploy target was a
# release: it rewrote the ref to `v<version>` on every bump and cleared the SHA,
# on the reasoning that a cleared field "fails loudly" until the release exists.
# That reasoning holds for `master`, which is deployed at a tag. It does not hold
# for `dev`, which is deployed continuously from the branch -- there, "fails
# loudly" is just broken. See is_release_ref() in bump_version.R for the
# distinction, and check_manifest.R, which now REQUIRES the SHA on both branches
# so neither can ship without one again.
#
# This is the `dev` half of the pair; .github/workflows/manifest-release-sha.yml
# is the `master` half, on `release: published`.
#
# WHY A PUSH TRIGGER rather than a manual dispatch. The root cause of the outage
# this replaces was a step nobody remembered -- v0.18.1 shipped unpinned for
# exactly that reason, as manifest-release-sha.yml's own header records. A
# dispatch-only design reintroduces the same failure mode. The cost is one
# mechanical commit per push to `dev`, which is the same trade manifest-sync.yml
# and pre-commit.yml already make.
#
# LOOP BREAK: this workflow pushes to `dev`, which is its own trigger. Two
# things stop that recurring, and it is worth being precise about which does the
# work. The REAL mechanism is that the push below is authored by the default
# GITHUB_TOKEN, and GitHub does not start new workflow runs for pushes made with
# it -- that rule exists specifically to prevent workflows triggering themselves.
# The `[skip ci]` in the commit message is belt-and-braces on top of that: it
# does nothing today, and becomes load-bearing the moment somebody swaps in a
# PAT (which branch protection on `dev` would force), at which point the
# self-trigger becomes real. Do not remove it as dead weight.
#
# Either way the recorded SHA trails the branch tip by the pinning commit
# itself. That is why check_manifest.R requires a branch SHA to be CONTAINED in
# the branch rather than equal to its tip.
name: manifest-dev-sha

on:
  push:
    branches: [dev]
  # INERT UNTIL THIS FILE REACHES `master`. GitHub reads workflow_dispatch (and
  # release) definitions from the DEFAULT branch only, so no "Run workflow"
  # button appears while this lives on `dev` alone -- the same trap that kept
  # manifest-release-sha.yml from ever firing, documented in its header. The
  # `push` trigger above is unaffected and works as soon as this is on `dev`;
  # this entry starts working when the next release merges `dev` into `master`.
  workflow_dispatch:

concurrency:
  # Serialised, not cancel-in-progress: each run commits, and cancelling one
  # mid-push would leave the branch pinned to a commit no run is going to revisit.
  group: manifest-dev-sha
  cancel-in-progress: false

jobs:
  pin-dev-sha:
    runs-on: ubuntu-latest
    permissions:
      # Needed to push the pin commit back to dev.
      contents: write

    steps:
      - uses: actions/checkout@v5
        with:
          ref: dev

      # setup-r alone, with no setup-r-dependencies step: the --set-deploy-sha
      # path in bump_version.R is deliberately base-R only, so there is no
      # package library to restore and this finishes in seconds. Same reasoning
      # as manifest-sync.yml and bump-version.yml.
      - name: Resolve dev's tip
        run: echo "SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - uses: r-lib/actions/setup-r@v2.12.1
        with:
          use-public-rspm: true

      - name: Pin manifest.json's RemoteSha/GithubSHA1 to dev
        run: Rscript .github/scripts/bump_version.R --set-deploy-sha "${SHA}"

      # Only commits when the bytes actually changed, so a push that did not move
      # the pin (a re-run, or a dispatch with nothing new) is a no-op rather than
      # an empty commit.
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: point manifest.json at dev@${{ env.SHA }} [skip ci]"
          file_pattern: inst/shiny/dta_app/manifest.json
          branch: dev
