# All available hooks: https://pre-commit.com/hooks.html
#
# R-specific checks (formerly https://github.com/lorenzwalthert/precommit)
# do NOT live here. That repo builds its own isolated ~40-package renv
# library on every run -- separate from the library CI's
# r-lib/actions/setup-r-dependencies already builds -- and that duplication
# broke in three independent ways (a `digest` that will not compile on
# R 4.5 + Rtools45, a cache outage with no error tolerance, and the two renv
# caches colliding on the same runner path). They now run as plain R scripts
# in .github/workflows/r-style.yaml, against the project's own installed
# library: see that file, .github/scripts/check_r_sanity.R and
# .github/scripts/check_deps_in_desc.R. Locally, run
# `Rscript -e "styler::style_pkg()"` and `Rscript -e "roxygen2::roxygenise()"`
# before committing (see CLAUDE.md).
#
# renv/staging_excluded/ is a vendored renv package-library snapshot that ended
# up tracked in git (renv/.gitignore only lists `staging/`, not the distinct
# `staging_excluded/` directory renv actually creates). It is not source code;
# every hook here would otherwise try to style/parse/roxygenize files inside
# other packages' vendored sources, which is both wrong and breaks on
# malformed vendored fixtures. Exclude it repo-wide until that tracked cruft
# is cleaned up separately.
exclude: '^renv/(library|staging|staging_excluded)/'
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      # `inst/extdata` holds shipped TEST FIXTURES, and in a delimited file
      # whitespace is data, not formatting. `trailing-whitespace` stripped the
      # trailing tabs from the one row in gf_data_small_smirna.tsv whose last
      # columns are legitimately empty, turning a 33-field row into a 27-field
      # one -- silent corruption of the exact record that fixture was reduced
      # to preserve. Line endings are equally load-bearing: fixtures are read
      # back byte-wise by some tests. So the whitespace hooks skip the data
      # directory. `.Rd` files stay excluded from end-of-file-fixer because
      # roxygen2 owns their exact trailing bytes.
      - id: end-of-file-fixer
        exclude: '(\.Rd$|^inst/extdata/)'
      - id: detect-private-key
      - id: check-ast
      - id: mixed-line-ending
        args: [--fix=lf]
        exclude: '^inst/extdata/'
      - id: trailing-whitespace
        exclude: '^inst/extdata/'
      - id: check-case-conflict
      # Check that there are no merge conflicts (could be generated by template sync)
      - id: check-merge-conflict
        args: [--assume-in-merge]
  - repo: https://github.com/pre-commit-ci/pre-commit-ci-config
    rev: v1.6.1
    hooks:
      # Only reuiqred when https://pre-commit.ci is used for config validation
      - id: check-pre-commit-ci-config
  - repo: local
    hooks:
      - id: forbid-to-commit
        name: Don't commit common R artifacts
        entry: Cannot commit .Rhistory, .RData, .Rds or .rds.
        language: fail
        files: '\.(Rhistory|RData|Rds|rds)$'
        exclude: "(inst/extdata|data)/.*"
  # - repo: https://github.com/pre-commit/mirrors-prettier
  #   rev: v3.0.0-alpha.6
  #   hooks:
  #     - id: prettier
  #       language_version: "17.9.1"

ci:
  autoupdate_schedule: monthly
