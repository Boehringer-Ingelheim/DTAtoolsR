<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 790 1660" width="790" height="1660" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#999999"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="790" height="1660" fill="#ffffff"/>

  <!-- Title -->
  <text x="20" y="40" font-size="24" font-weight="bold" fill="#000000">DTAtools &#8212; Package Architecture</text>
  <text x="20" y="64" font-size="17" fill="#666666">Class hierarchy mapping how a Data Transmission Specification (DTS) is structured</text>

  <!-- Edges -->
  <g fill="none" stroke="#999999" stroke-width="2.5">
    <polyline points="35,165 35,207.5 80,207.5" marker-end="url(#arrowGray)"/>
    <polyline points="35,165 35,277.5 80,277.5" marker-end="url(#arrowGray)"/>
    <polyline points="95,305 95,347.5 140,347.5" stroke-dasharray="7,5" marker-end="url(#arrowGray)"/>
    <polyline points="155,375 155,417.5 200,417.5" marker-end="url(#arrowGray)"/>
    <polyline points="215,445 215,488 260,487.5" stroke-dasharray="7,5" marker-end="url(#arrowGray)"/>
    <polyline points="215,445 215,558 260,557.5" stroke-dasharray="7,5" marker-end="url(#arrowGray)"/>
    <polyline points="215,445 215,628 260,627.5" stroke-dasharray="7,5" marker-end="url(#arrowGray)"/>
    <polyline points="155,375 155,700.5 200,700.5" marker-end="url(#arrowGray)"/>
    <polyline points="215,728 215,770.5 260,770.5" marker-end="url(#arrowGray)"/>
    <polyline points="275,798 275,840.5 320,840.5" stroke-dasharray="7,5" marker-end="url(#arrowGray)"/>
    <polyline points="215,728 215,910.5 260,910.5" marker-end="url(#arrowGray)"/>
    <polyline points="275,938 275,980.5 320,980.5" stroke-dasharray="7,5" marker-end="url(#arrowGray)"/>
    <polyline points="275,938 275,1050.5 320,1050.5" stroke-dasharray="7,5" marker-end="url(#arrowGray)"/>
    <polyline points="275,938 275,1120.5 320,1120.5" stroke-dasharray="7,5" marker-end="url(#arrowGray)"/>
    <polyline points="155,375 155,1190.5 200,1190.5" marker-end="url(#arrowGray)"/>
    <polyline points="215,1218 215,1271.5 260,1271.5" stroke-dasharray="7,5" marker-end="url(#arrowGray)"/>
    <polyline points="95,305 95,1353.5 140,1353.5" stroke-dasharray="7,5" marker-end="url(#arrowGray)"/>
    <polyline points="155,1381 155,1423.5 200,1423.5" marker-end="url(#arrowGray)"/>
    <polyline points="155,1381 155,1493.5 200,1493.5" marker-end="url(#arrowGray)"/>
  </g>
  <g fill="none" stroke="#b85450" stroke-width="2.5" stroke-dasharray="7,5">
    <polyline points="400,487.5 430,487.5 430,557.5 460,557.5" marker-end="url(#arrowRed)"/>
    <polyline points="400,557.5 460,557.5" marker-end="url(#arrowRed)"/>
    <polyline points="400,627.5 430,627.5 430,557.5 460,557.5" marker-end="url(#arrowRed)"/>
    <polyline points="590,557.5 760,558 760,1272 720,1271.5" marker-end="url(#arrowRed)"/>
  </g>

  <!-- Nodes -->
  <!-- n0 DTA -->
  <rect x="20" y="110" width="460" height="55" rx="6" fill="#dae8fc" stroke="#6c8ebf" stroke-width="2"/>
  <text x="32" y="131.5" font-size="18" font-weight="bold">DTA</text>
  <text x="32" y="151.5" font-size="15" fill="#666666">top-level agreement container</text>

  <!-- n1 metadata -->
  <rect x="80" y="180" width="460" height="55" rx="6" fill="#d5e8d4" stroke="#82b366" stroke-width="2"/>
  <text x="92" y="192.5" font-size="18" font-weight="bold">metadata</text>
  <text x="92" y="210.5" font-size="15" fill="#666666"><tspan font-style="italic">DTAMetaData </tspan>&#8212; title, version, contacts,</text>
  <text x="92" y="228.5" font-size="15" fill="#666666">transmission schedule</text>

  <!-- n2 datasets -->
  <rect x="80" y="250" width="460" height="55" rx="6" fill="#d5e8d4" stroke="#82b366" stroke-width="2"/>
  <text x="92" y="271.5" font-size="18" font-weight="bold">datasets</text>
  <text x="92" y="291.5" font-size="15" fill="#666666">named list of <tspan font-style="italic">DTADataSet </tspan>&#8212; one or more per DTS</text>

  <!-- n3 DTADataSetTabular -->
  <rect x="140" y="320" width="460" height="55" rx="6" fill="#dae8fc" stroke="#6c8ebf" stroke-width="2"/>
  <text x="152" y="341.5" font-size="18" font-weight="bold">DTADataSetTabular</text>
  <text x="152" y="361.5" font-size="15" fill="#666666">tabular data: full column-spec + rule validation</text>

  <!-- n5 files -->
  <rect x="200" y="390" width="460" height="55" rx="6" fill="#d5e8d4" stroke="#82b366" stroke-width="2"/>
  <text x="212" y="411.5" font-size="18" font-weight="bold">files</text>
  <text x="212" y="431.5" font-size="15" fill="#666666">list &#8212; file handlers: patterns, count, naming</text>

  <!-- n8 DTAFileCSV -->
  <rect x="260" y="460" width="140" height="55" rx="6" fill="#dae8fc" stroke="#6c8ebf" stroke-width="2"/>
  <text x="272" y="493.5" font-size="18" font-weight="bold">DTAFileCSV</text>

  <!-- n9 DTAFileTSV -->
  <rect x="260" y="530" width="140" height="55" rx="6" fill="#dae8fc" stroke="#6c8ebf" stroke-width="2"/>
  <text x="272" y="563.5" font-size="18" font-weight="bold">DTAFileTSV</text>

  <!-- n10 DTAFileDelim -->
  <rect x="260" y="600" width="140" height="55" rx="6" fill="#dae8fc" stroke="#6c8ebf" stroke-width="2"/>
  <text x="272" y="633.5" font-size="18" font-weight="bold">DTAFileDelim</text>

  <!-- n20 read_file() -->
  <rect x="460" y="530" width="130" height="55" rx="6" fill="#f8cecc" stroke="#b85450" stroke-width="2"/>
  <text x="472" y="551.5" font-size="18" font-weight="bold">read_file()</text>
  <text x="472" y="571.5" font-size="15" fill="#666666">&#8594; Arrow Table</text>

  <!-- n6 specs -->
  <rect x="200" y="673" width="470" height="55" rx="6" fill="#d5e8d4" stroke="#82b366" stroke-width="2"/>
  <text x="212" y="685.5" font-size="18" font-weight="bold">specs</text>
  <text x="212" y="703.5" font-size="15" fill="#666666"><tspan font-style="italic">DTAColumnSpecCollection </tspan>&#8212; column specs +</text>
  <text x="212" y="721.5" font-size="15" fill="#666666">cross-column rules</text>

  <!-- n11 columns -->
  <rect x="260" y="743" width="460" height="55" rx="6" fill="#d5e8d4" stroke="#82b366" stroke-width="2"/>
  <text x="272" y="764.5" font-size="18" font-weight="bold">columns</text>
  <text x="272" y="784.5" font-size="15" fill="#666666">named list of <tspan font-style="italic">DTAColumnSpec</tspan></text>

  <!-- n13 DTAColumnSpec x N -->
  <rect x="320" y="813" width="400" height="55" rx="6" fill="#fff2cc" stroke="#d6b656" stroke-width="2"/>
  <text x="332" y="825.5" font-size="18" font-weight="bold">DTAColumnSpec &#215; N</text>
  <text x="332" y="843.5" font-size="15" fill="#666666">type, nullable, values/pattern,</text>
  <text x="332" y="861.5" font-size="15" fill="#666666">length, format</text>

  <!-- n12 rules -->
  <rect x="260" y="883" width="460" height="55" rx="6" fill="#d5e8d4" stroke="#82b366" stroke-width="2"/>
  <text x="272" y="904.5" font-size="18" font-weight="bold">rules</text>
  <text x="272" y="924.5" font-size="15" fill="#666666">list of DTARule</text>

  <!-- n14 DTARuleColCondition x N -->
  <rect x="320" y="953" width="400" height="55" rx="6" fill="#fff2cc" stroke="#d6b656" stroke-width="2"/>
  <text x="332" y="974.5" font-size="18" font-weight="bold">DTARuleColCondition &#215; N</text>
  <text x="332" y="994.5" font-size="15" fill="#666666">if/then cross-column logic</text>

  <!-- n15 DTARuleColRange x N -->
  <rect x="320" y="1023" width="400" height="55" rx="6" fill="#fff2cc" stroke="#d6b656" stroke-width="2"/>
  <text x="332" y="1044.5" font-size="18" font-weight="bold">DTARuleColRange &#215; N</text>
  <text x="332" y="1064.5" font-size="15" fill="#666666">numeric range constraint</text>

  <!-- n16 DTARuleColUnique x N -->
  <rect x="320" y="1093" width="400" height="55" rx="6" fill="#fff2cc" stroke="#d6b656" stroke-width="2"/>
  <text x="332" y="1114.5" font-size="18" font-weight="bold">DTARuleColUnique &#215; N</text>
  <text x="332" y="1134.5" font-size="15" fill="#666666">uniqueness (single or composite key)</text>

  <!-- n7 tables -->
  <rect x="200" y="1163" width="460" height="55" rx="6" fill="#d5e8d4" stroke="#82b366" stroke-width="2"/>
  <text x="212" y="1184.5" font-size="18" font-weight="bold">tables</text>
  <text x="212" y="1204.5" font-size="15" fill="#666666">named list &#8212; actual data as Arrow Tables</text>

  <!-- n17 table_name -->
  <rect x="260" y="1233" width="460" height="77" rx="6" fill="#fff2cc" stroke="#d6b656" stroke-width="2"/>
  <text x="272" y="1247.5" font-size="18" font-weight="bold">&#171;table_name&#187;</text>
  <text x="272" y="1267.5" font-size="15" fill="#666666">populated via load_file() via <tspan font-style="italic">DTA </tspan>or <tspan font-style="italic">DTADataSet</tspan>,</text>
  <text x="272" y="1285.5" font-size="15" fill="#666666">read_file() from <tspan font-style="italic">DTAFile </tspan>or programmatically</text>
  <text x="272" y="1303.5" font-size="15" fill="#666666">via constructor</text>

  <!-- n4 DTADataSetFile -->
  <rect x="140" y="1326" width="460" height="55" rx="6" fill="#dae8fc" stroke="#6c8ebf" stroke-width="2"/>
  <text x="152" y="1347.5" font-size="18" font-weight="bold">DTADataSetFile</text>
  <text x="152" y="1367.5" font-size="15" fill="#666666">non-tabular: file presence/readability check</text>

  <!-- n18 file_paths -->
  <rect x="200" y="1396" width="460" height="55" rx="6" fill="#d5e8d4" stroke="#82b366" stroke-width="2"/>
  <text x="212" y="1417.5" font-size="18" font-weight="bold">file_paths</text>
  <text x="212" y="1437.5" font-size="15" fill="#666666">expected file paths (character vector)</text>

  <!-- n19 files -->
  <rect x="200" y="1466" width="460" height="55" rx="6" fill="#d5e8d4" stroke="#82b366" stroke-width="2"/>
  <text x="212" y="1487.5" font-size="18" font-weight="bold">files</text>
  <text x="212" y="1507.5" font-size="15" fill="#666666">list &#8212; DTAFile descriptors</text>

  <!-- Legend -->
  <text x="20" y="1548" font-size="17" font-weight="bold">Legend</text>

  <rect x="20" y="1567" width="28" height="28" rx="4" fill="#dae8fc" stroke="#6c8ebf" stroke-width="2"/>
  <text x="58" y="1587" font-size="17">S7 class</text>

  <rect x="20" y="1607" width="28" height="28" rx="4" fill="#d5e8d4" stroke="#82b366" stroke-width="2"/>
  <text x="58" y="1627" font-size="17">Property / list container</text>

  <rect x="360" y="1607" width="28" height="28" rx="4" fill="#fff2cc" stroke="#d6b656" stroke-width="2"/>
  <text x="398" y="1627" font-size="17">Instance(s) &#8212; cardinality &#215; N</text>

  <rect x="360" y="1567" width="28" height="28" rx="4" fill="#f8cecc" stroke="#b85450" stroke-width="2"/>
  <text x="398" y="1587" font-size="17">Method / derived output</text>
</svg>
