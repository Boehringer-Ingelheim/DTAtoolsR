datasets:
  - name: clinical_data
    type: tabular
    description: Clinical data table

    files:
      filename: "clinical_data.*.csv$"
      pattern: Yes
      number_of_files: 1
      type: "csv"

    columns:
      - id: STUDYID
        label: Study Identifier
        type: SAS Char
        nullable: false
        length: 10
        values:
          - 1234-5678
        description: Unique study ID
      - id: VISIT
        label: Visit
        type: SAS Char
        length: 12
        nullable: false
        values:
          - V01
          - V02
          - V03
          - EOT
        description: Visit code
      - id: AGE
        label: Age
        type: SAS Num
        nullable: false
        description: Age in years
      - id: GENDER
        label: Gender
        type: SAS Char
        nullable: false
        values:
          - Male
          - Female
          - Other
        description: Gender of subject
      - id: INCLUDE
        label: Include in analysis
        type: SAS Char
        length: 1
        nullable: true
        values:
          - "Y"
          - "N"
        description: Flag for inclusion
      - id: HEIGHT
        label: Height (cm)
        type: SAS Num
        nullable: false
        description: Height in centimeters
      - id: WEIGHT
        label: Weight (kg)
        type: SAS Num
        nullable: false
        description: Weight in kilograms
      - id: BMI
        label: Body Mass Index
        type: SAS Num
        nullable: false
        description: Calculated BMI
      - id: STATUS
        label: Visit Status
        type: SAS Char
        nullable: true
        values:
          - COMPLETED
          - DROPPED
          - PENDING
        description: Status of visit
      - id: CONSENT
        label: Consent Given
        type: SAS Char
        nullable: true
        values:
          - "YES"
          - "NO"
        description: Consent status
      - id: CONSENT_DATE
        label: Consent Date
        type: SAS Char
        nullable: true
        description: Date of consent
      - id: AE_TERM
        label: Adverse Event Term
        type: SAS Char
        nullable: true
        description: Adverse event term
      - id: SAE_TERM
        label: Serious Adverse Event Term
        type: SAS Char
        nullable: true
        description: Serious adverse event term
      - id: SUBJECT_ID
        label: Subject Identifier
        type: SAS Char
        nullable: false
        description: Unique subject ID

    rules:
      - id: rule_equal_example
        type: col_condition
        condition:
          VISIT:
            equals: V03
        then:
          STATUS:
            equals: COMPLETED
      - id: rule_unequal_example
        type: col_condition
        condition:
          VISIT:
            equals: V03
        then:
          STATUS:
            not_equals: DROPPED
      - id: rule_range_example
        type: col_range
        column: AGE
        min: 18
        max: 65
      - id: rule_dependency_example
        type: col_condition
        condition:
          CONSENT:
            equals: "YES"
        then:
          CONSENT_DATE:
            empty: false
      - id: rule_unique_example
        type: col_unique
        column: 
          - SUBJECT_ID
          - VISIT
      - id: check_col_condition_example
        type: col_condition
        condition:
          VISIT:
            equals: V03
        then:
          STATUS:
            equals: COMPLETED
          VISIT:
            in:
              - V03
              - EOT
          AGE:
            min: 10
            max: 100
          WEIGHT:
            greater_equal: 5
      - id: group_condition_pass_example
        type: group_condition
        description: Grouped pass showcase - every row with a visit must have status
        group_by:
          - SUBJECT_ID
        conditions:
          c_has_visit:
            VISIT:
              empty: false
          c_has_status:
            STATUS:
              empty: false
        constraints:
          - id: visit_requires_status
            type: requires
            if: c_has_visit
            then: c_has_status
            if_scope: any
            then_scope: all
      - id: group_condition_fail_example
        type: group_condition
        description: Grouped fail showcase - consented records need a consent date
        group_by:
          - SUBJECT_ID
        conditions:
          c_consent_yes:
            CONSENT:
              equals: "YES"
          c_consent_date_present:
            CONSENT_DATE:
              empty: false
        constraints:
          - id: consent_requires_date_grouped
            type: requires
            if: c_consent_yes
            then: c_consent_date_present
            if_scope: any
            then_scope: all

  # A second dataset in the SAME transfer that is never parsed. `type: file`
  # builds a DTADataSetFile, whose entire contract is that the deliverable
  # arrived, is readable and is not empty -- no columns, no rules, no import.
  # Its handler is `type: any` (a DTAFileAny): the reader-less handler. A `csv`
  # handler here would claim the file gets parsed, which it never is.
  - name: raw_export
    type: file
    description: >-
      Compressed raw export delivered alongside the clinical data table. It is
      archived, not analysed, so the transfer only confirms that it arrived,
      is readable and is not empty.

    files:
      type: any
      filename: clinical_data2.csv.gz
      number_of_files: 1
      info: Compressed raw export of the clinical data table.
