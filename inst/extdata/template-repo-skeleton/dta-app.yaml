# App configuration for this template library (optional).
#
# Every key below is commented out and shows its default. To change a setting,
# uncomment the section line (for example "colors:") AND the keys you set
# under it, by removing the leading "# " from each of those lines; a key
# uncommented without its section line is a YAML error. features.start and
# exports.word_templates are sections inside a section: uncomment their own
# line as well. With everything commented out the app looks and behaves like
# the stock DTAtools app.
#
# This file belongs in the repository root, next to the templates/, parties/,
# vocabulary/ and export-templates/ folders; the app reads it nowhere else.
# The logo is a file that sits next to this file, in the repository root. Word
# templates sit in export-templates/: every .docx there that holds a {PLACEHOLDER}
# marker is offered in the export dialog without being listed here (see exports.word_templates for
# an optional label and order). Files are referenced by a relative path from
# this folder (no "..", no absolute path). A bad value never stops the app: it
# is reported and that setting
# keeps its default. A file that cannot be parsed at all is different: the app
# warns and uses the defaults for EVERYTHING, so restrictions such as
# "editing: false" are not enforced. Run validate_template(".", strict = TRUE)
# before you deploy.
kind: dta_app_config

# --- organisation: who runs this deployment ---------------------------------
# organisation:
#   name: ""                  # Organisation shown in the footer; empty shows none.
#   unit: ""                  # Department or group, appended to the name.

# --- document: what this library calls its documents -------------------------
# Each key is one plain-text string, or a list of one to three strings. The
# name appears as the main title of every export; the abbreviation replaces
# "DTA" in the app's buttons and messages. A library that offers both kinds
# lists them in the same order (the two lists must then be the same length).
# Abbreviations are at most 12 characters.
# document:
#   name: Data Transfer Agreement          # or [Data Transfer Agreement, Data Transmission Specification]
#   abbreviation: DTA                      # or [DTA, DTS]

# --- branding: titles, logo and landing-page text ---------------------------
# branding:
#   app_title: DTAtools       # Name shown in the brand bar.
#   app_subtitle: Validation and authoring of Data Transfer Agreements (DTA) and Data Transmission Specifications (DTS)  # Line under the title.
#   window_title: DTAtools    # Browser tab title; defaults to app_title.
#   footer_label: ""          # Footer text; defaults to "<name> · <unit>"; "" hides it.
#   logo: logo.png            # Image file in the repository root (png, jpg, jpeg, gif, svg, webp; at most 1 MB). Default: the DTAtools logo.
#   logo_alt: DTAtools logo   # Alternative text for the logo; defaults to "<app_title> logo".
#   landing_headline: Check a data transfer against its specification.  # Large headline on the start page.
#   landing_lede: Open a DTA or DTS YAML file, load the data files it expects, run the checks, and export the agreement.  # Paragraph under the headline.

# --- colors: hex colours only ------------------------------------------------
# ALWAYS put colours in quotes. An unquoted #00625B is a YAML comment, so the
# value would silently become empty. Only #RGB or #RRGGBB are accepted.
# colors:
#   primary: "#00625B"        # Main brand colour (buttons, brand bar).
#   primary_dark: "#003D38"   # Darker brand shade (hover, headings).
#   primary_light: "#E6F1EF"  # Light brand tint (selected rows, chips).
#   accent: "#00A886"         # Highlight colour (focus ring, accents).
#   text: "#1A2B2A"           # Body text.
#   muted: "#5B6B6A"          # Secondary text.
#   page_background: "#F4F7F6"  # Page background.
#   surface: "#FFFFFF"        # Cards, dialogs and other raised surfaces.
#   warning: "#C77700"        # Warning text and markers.
#   warning_dark: "#B26A00"   # Darker warning shade.
#   nodata_border: "#EBD9B6"  # Border of the "no data" status chip.
#   unknown: "#b8860b"        # Files whose import was never checked (amber marker).
#   pass: "#1E8E5A"           # Passed checks.
#   pass_bg: "#E5F4EC"        # Background of passed checks.
#   pass_border: "#9BD3B4"    # Border of passed checks.
#   fail: "#C0392B"           # Failed checks.
#   fail_bg: "#FBEAE7"        # Background of failed checks.
#   fail_border: "#E9B4AC"    # Border of failed checks.
#   pending: "#5B6B6A"        # Checks not run yet.
#   pending_bg: "#EEF1F1"     # Background of checks not run yet.
#   pending_border: "#CDD5D4" # Border of checks not run yet.

# --- links: http(s):// or mailto: URLs; false hides a link -------------------
# links:
#   report_issue: https://github.com/Boehringer-Ingelheim/DTAtoolsR/issues  # "Report an issue" link.
#   about: https://github.com/Boehringer-Ingelheim/DTAtoolsR#credits  # "About" link.
#   repository: https://github.com/Boehringer-Ingelheim/DTAtoolsR  # Repository link in the footer.
#   documentation: false      # Documentation link; hidden by default, set a URL to show it.

# --- features: what the app offers --------------------------------------------
# features:
#   start:
#     load_example: true          # Start-page button: open the bundled example.
#     create_from_template: true  # Start-page button: create from a template.
#     create_blank: true          # Start-page button: create a blank document (forced off when editing is false).
#   raw_yaml_tab: true            # Tab with the raw YAML editor.
#   raw_yaml_editable: true       # false: the raw YAML tab is shown but read-only (no "Apply changes").
#   dataset_yaml_download: true   # Download button for a single dataset's YAML.
#   dta_yaml_download: true       # Download button for the whole DTA YAML.
#   editing: true                 # false makes the app read-only: no edit menu, no editing at all.

# --- exports: documents and validation downloads ------------------------------
# exports:
#   document: [markdown, markdown_pdf, word, word_template]  # Formats offered under "Export DTA"; [] hides the button.
#   default_document: word        # Preselected format; must be one of the formats above.
#   word_templates:               # Optional label and order for the .docx files in export-templates/ (every .docx there with a {PLACEHOLDER} marker is offered anyway).
#     - file: export-templates/our_dta.docx  # Path relative to the repository root.
#       label: Our DTA template   # Name shown in the list; defaults to the file name without extension.
#   bundled_word_templates: true  # Keep the packaged clinical Word template in the list.
#   validation_messages: [csv, tsv, xlsx, html]  # Download buttons for validation messages; [] hides them.
#   validation_summary: true      # Offer the HTML validation summary in the sidebar.
