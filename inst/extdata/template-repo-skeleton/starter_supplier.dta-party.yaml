  affiliation and contacts in one step instead of retyping them.
affiliation:
  name: Starter Supplier Inc.
  address: 1 Example Street, Springfield
  country: DE
contacts:
  - name: Jane Doe
    role: Data Manager
    email: jane.doe@example.com
    signature: true
