# Validates the templates in templates/ (auto-detected; a template file left
# at the root fails the build).
# -----------------------------------------------------------------------------
# CI for a PRIVATE DTAtools template repository -- Bitbucket CLOUD Pipelines.
#
# Bitbucket Pipelines is a Bitbucket CLOUD feature; Bitbucket Server / Data
# Center has no equivalent and never reads this file. For Server / Data
# Center, use the Jenkinsfile instead (`create_template_repo(path, ci =
# "jenkins")` writes it).
#
# Lives at `bitbucket-pipelines.yml` in the root of the repository that holds
# your `*.dta-template.yaml` / `*.dta-dataset-template.yaml` /
# `*.dta-party.yaml` / `*.dta-vocabulary.yaml` files. Bitbucket clones the
# repository automatically before running the steps below (there is no
# separate checkout step, unlike GitHub Actions); this pipeline installs
# DTAtools and runs `lint_template_repo(".")`. The linter runs every
# `validate_template()` check -- the same structural checks (and, as a final
# step, an actual dry-run build of every non-abstract creation template) the
# bundled Shiny app's own "Create new from template" picker relies on -- plus
# repository-format checks (folder-name case, id/file-name agreement, YAML
# files the app would silently ignore), without starting the app. It prints
# every finding and fails the build on any severity "error", which is what
# turns this pipeline red. A team that wants warnings to fail it too passes
# `fail_on = "warning"`.
# -----------------------------------------------------------------------------

image: rocker/r-ver:4.4 # any R image able to install DTAtools

definitions:
  steps:
    - step: &validate-templates
        name: validate-templates
        script:
          # `remotes` is only for the install examples below; DTAtools' own
          # Imports come with DTAtools itself.
          - Rscript -e 'install.packages("remotes")' # skip if already baked into the image
          # ---------------------------------------------------------------
          # PLACEHOLDER: install DTAtools from your internal package
          # repository. This is deliberately NOT filled in -- the source (an
          # internal Artifactory/RSPM mirror, a Bitbucket Data Center remote
          # via remotes::install_git(), or a pre-built package baked into a
          # custom pipeline image) is specific to your organisation. Replace
          # the line below with whichever of those applies. A couple of
          # common shapes:
          #
          #   Rscript -e 'remotes::install_git("https://bitbucket.example.com/scm/proj/DTAtoolsR.git")'
          #   Rscript -e 'install.packages("DTAtools", repos = "https://internal-rspm.example.com")'
          # ---------------------------------------------------------------
          - Rscript -e 'stop("Replace this step with an install of DTAtools from your internal package repository.")'
          - Rscript -e 'DTAtools::lint_template_repo(".")'

pipelines:
  default:
    - step: *validate-templates
  pull-requests:
    '**':
      - step: *validate-templates
