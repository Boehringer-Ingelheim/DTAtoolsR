metadata:
  title: Omics Matrix Delivery
  version: "1.0"
  date: 2026-11-13

datasets:
  # Genes x samples, as merged by nf-core/rnaseq. Every line starts with two
  # row-label columns; every further column is one sample.
  - id: gene_counts
    type: matrix
    files: { filename: "matrix_gene_counts.tsv", type: tsv }
    row_labels:                       # the leading columns, by position
      - id: GENE_ID                   # the first one is the default row key
        header: gene_id               # the header line's text above this column
        type: SAS Char
        nullable: No
        pattern: '^ENSG[0-9]{11}(\.[0-9]+)?(_PAR_Y)?$'
      - id: GENE_NAME                 # a row description
        header: gene_name
        type: SAS Char
        nullable: Yes
    matrix:
      columns:                        # the data columns: one per sample
        label: Sample ID
        pattern: "^S[0-9]{4}$"        # what every column label must look like
        count: { min: 1, max: 384 }
      rows:
        key: GENE_ID
        count: { min: 1 }
      cells:
        type: SAS Num                 # normalised counts are fractional
        nullable: No
        range: { min: 0 }
        infinite: No

  # Samples x miRNAs, as written by nf-core/smrnaseq (R write.csv: the header
  # line has an empty field above the row names).
  - id: mature_counts
    type: matrix
    files: { filename: "matrix_mature_counts.csv", type: csv }
    row_labels:
      - id: SAMPLE
        header: ""
        type: SAS Char
        nullable: No
    matrix:
      columns:
        pattern: "^hsa-(miR|let)-"
      cells:
        type: SAS Int
        nullable: No
        range: { min: 0 }
