area: APP
title: The interactive application

# The app is the one place in the package where a user never sees check()'s
# return value directly -- they see a coloured status and a notification, and
# act on that. Everything in this area exists because a mismatch between what
# the validation engine found and what the screen shows is invisible to
# anyone reading only the app: the reactive state IS the interface, so a bug
# in how it is built or updated is a bug the user cannot see around.
#
# Reached almost entirely through shiny::testServer() against the bundled app
# directory, the same technique the package's own development suite
# (tests/testthat/test-shinyapp-*.R) uses. A handful of behaviours have no
# server-side component at all -- see REQ-APP-013's notes -- and are pinned
# structurally instead, exactly as the development suite already does for the
# same reason.

requirements:
  # ---- launching the application --------------------------------------------

  - id: REQ-APP-001
    text: >
      run_dta_app() shall accept launch.browser (default TRUE), an optional
      port, and further arguments passed through to shiny::runApp(), and
      shall require the shiny, bslib and DT packages.
    risk: low
    category: interface
    covers: [run_dta_app]
    source: R/run_dta_app.R

  - id: REQ-APP-002
    text: >
      run_dta_app() shall resolve the application directory bundled with the
      installed package and pass it, together with launch.browser and any
      supplied port, to shiny::runApp().
    risk: medium
    category: functional
    covers: [run_dta_app]
    source: R/run_dta_app.R

  - id: REQ-APP-003
    text: >
      When a required package is not installed, run_dta_app() shall raise one
      condition naming every missing package and shall never call
      shiny::runApp().
    risk: medium
    category: functional
    covers: [run_dta_app]
    source: R/run_dta_app.R

  # ---- the reactive workspace and loading a specification --------------------

  - id: REQ-APP-004
    text: >
      The application's reactive workspace shall hold no document, no active
      dataset and no upload until a specification is loaded.
    risk: low
    category: functional
    covers: [run_dta_app]
    source: inst/shiny/dta_app/app.R

  - id: REQ-APP-005
    text: >
      Loading a DTA YAML specification shall populate the reactive document,
      select its first dataset as active, and report every declared dataset's
      status as "pending".
    risk: high
    category: functional
    covers: [run_dta_app, read_dta_from_yaml]
    source: inst/shiny/dta_app/R/utils_dta.R apply_loaded()

  - id: REQ-APP-006
    text: >
      Loading a specification shall replace the reactive workspace entirely:
      the uploads, the per-dataset status map and the active dataset from a
      previously loaded document shall carry none of their prior values
      forward.
    risk: high
    category: integrity
    covers: [run_dta_app]
    source: inst/shiny/dta_app/R/utils_dta.R apply_loaded()
    notes: >
      A validation tool that quietly carried an upload or a status forward
      from a document the user has since replaced would let a stale verdict
      be read against the wrong specification.

  # ---- datasets: add, remove, bind --------------------------------------------

  - id: REQ-APP-007
    text: >
      Adding a dataset shall be refused unless the document is in edit mode,
      and while in edit mode shall extend both the document and the
      per-dataset status map, the new entry reported "nodata".
    risk: medium
    category: functional
    covers: [run_dta_app]
    source: inst/shiny/dta_app/app.R

  - id: REQ-APP-008
    text: >
      Removing a dataset, once confirmed, shall drop it from both the
      document and the per-dataset status map.
    risk: medium
    category: functional
    covers: [run_dta_app]
    source: inst/shiny/dta_app/app.R

  - id: REQ-APP-009
    text: >
      Binding a data file to a dataset's file handler shall register the
      upload keyed by dataset id and handler index and shall leave the
      dataset's status at "pending" rather than validating it; binding a file
      that would replace an already-bound table shall require the caller to
      confirm the overwrite before it takes effect.
    risk: high
    category: functional
    covers: [run_dta_app]
    source: inst/shiny/dta_app/app.R handle_upload()
    notes: >
      The overwrite confirmation is the app's own version of REQ-ROBUST-004:
      a dropped file that silently replaced bound data would validate the
      wrong delivery without saying so.

  # ---- validation: check and status -------------------------------------------

  - id: REQ-APP-010
    text: >
      Running a check shall map each targeted dataset's outcome onto exactly
      one of the app's four status values -- pass, fail, pending, nodata --
      and a dataset with no data bound shall always be reported "nodata",
      never "pass", regardless of what the underlying validation result would
      say on its own.
    risk: high
    category: functional
    covers: [run_dta_app, check]
    source: inst/shiny/dta_app/R/utils_dta.R dta_status_map()
    notes: >
      "pass"/"fail"/"pending"/"nodata" is the real, exact vocabulary read from
      rv$status's own definition in app.R -- not "valid"/"invalid" or
      check()'s own status strings, which the app deliberately does not
      expose as-is.

  - id: REQ-APP-011
    text: >
      A value the reader cannot parse as its declared type shall be reported
      through the import axis, and a dataset with only an import-axis
      violation shall be reported "fail" the same way a column-specification
      or rule violation would be.
    risk: high
    category: functional
    covers: [run_dta_app, check, messages]
    source: inst/shiny/dta_app/app.R
    notes: >
      This is REQ-VAL-002's independent-axes contract observed from the
      app's own reactive state rather than from check()'s return value
      directly -- the concern this area exists for.

  # ---- edit mode ---------------------------------------------------------------

  - id: REQ-APP-012
    text: >
      "Enable edit mode" shall unlock every specification-editing surface
      without appending a version-history entry, and "Stop editing" shall
      lock them again so that a specification change attempted afterward does
      not reach the document.
    risk: high
    category: functional
    covers: [run_dta_app]
    source: inst/shiny/dta_app/app.R
    notes: >
      Read-only-by-default is deliberately scoped to the SPECIFICATION only:
      loading a document, uploading files and running checks are never gated
      on edit mode, or the app's default mode would be useless for the one
      thing most users open it to do.

  # ---- the double-click guard --------------------------------------------------

  - id: REQ-APP-013
    text: >
      The script the application emits to guard its action buttons against a
      double click shall be a syntactically self-contained inline <script>
      (no unescaped "</script" in its body) registered on the click event's
      CAPTURE phase, so a click swallowed by an element's own handler still
      reaches the guard.
    risk: medium
    category: functional
    covers: [run_dta_app]
    source: inst/shiny/dta_app/R/ui_components.R click_guard_script()
    notes: >
      PINNED AS STRUCTURAL, NOT REACTIVE: the guard is pure client-side
      JavaScript with no server-side observer at all (app.R's own comment
      at the point it is inserted says so directly), and no JavaScript
      engine is anywhere in the package's dependency set. This is exactly
      why the package's own development suite
      (test-shinyapp-click-guard.R) tests it the same way -- by asserting
      the safety properties the guard's correctness rests on through the
      app's helper environment, not by driving it through
      shiny::testServer(). Recorded here rather than left uncovered because
      the app ships no OTHER protection against a duplicated click.

  # ---- exporting a report -------------------------------------------------------

  - id: REQ-APP-014
    text: >
      Exporting the HTML validation report shall be refused until at least
      one loaded dataset has been checked, and once produced shall be a
      well-formed HTML file naming the checked dataset.
    risk: medium
    category: functional
    covers: [run_dta_app, write_validation_report]
    source: inst/shiny/dta_app/app.R output$dl_msgs_html

  # ---- templates: creation, inheritance, party profiles -----------------------

  - id: REQ-APP-015
    text: >
      Creating a document from a bundled creation template shall apply the
      template's base metadata, and a party profile chosen for one of the
      template's party slots shall overwrite that slot's affiliation and
      contacts in the new document's metadata. A datasets[] reference in the
      template shall resolve only to a file inside the directory the template
      itself was found in, or to a bundled file named without a path; a
      reference that is absolute, or that climbs out of that directory, shall
      resolve to nothing rather than to the file it names.
    risk: medium
    category: functional
    covers: [run_dta_app]
    source: inst/shiny/dta_app/R/template_core.R create_dta_from_template()

  - id: REQ-APP-016
    text: >
      Creating a document from a template that extends another shall carry
      the parent's base metadata and options forward unchanged wherever the
      child does not override them, and shall apply the child's own dataset
      patch on top of the imported dataset template.
    risk: medium
    category: functional
    covers: [run_dta_app]
    source: inst/shiny/dta_app/R/template_inherit.R

  # ---- the controlled vocabulary picker -----------------------------------------

  - id: REQ-APP-017
    text: >
      Choosing permitted values from a controlled vocabulary for a column
      being edited shall replace that column's pending allowed values with
      the selected terms and clear any pending pattern constraint, without
      changing the saved specification until the column is saved; a
      vocabulary reference that cannot be resolved shall report a message
      rather than raise an error.
    risk: medium
    category: functional
    covers: [run_dta_app]
    source: inst/shiny/dta_app/app.R col_vocab_apply / output$col_vocab_terms

  # ---- versioning ---------------------------------------------------------------

  - id: REQ-APP-018
    text: >
      Creating a new version shall append exactly one version-history entry
      and update the document's recorded version; a blank version shall be
      refused, leaving the document and its edit lock unchanged.
    risk: medium
    category: functional
    covers: [run_dta_app]
    source: inst/shiny/dta_app/app.R

  # ---- editing a dataset's columns and rules -------------------------------------

  - id: REQ-APP-019
    text: >
      Saving a column under an id renamed from another column's id shall be
      refused with a message naming the id that already exists when a column
      under that id already exists, leaving both the renamed and the existing
      column unchanged; renaming onto an id nothing else holds shall proceed.
    risk: high
    category: functional
    covers: [run_dta_app]
    source: inst/shiny/dta_app/R/utils_dta.R dta_set_column
    notes: >
      Before the fix, a rename onto an existing id fell straight through to
      `cols[[id]] <- spec`, so the editor's rename field could silently
      destroy an unrelated column with no warning and no way back short of
      re-adding it from memory.

  - id: REQ-APP-020
    text: >
      Saving a column through the editor form shall carry that column's
      `examples` and `colclass` forward unchanged, because the form exposes no
      field for either.
    risk: medium
    category: functional
    covers: [run_dta_app]
    source: inst/shiny/dta_app/R/utils_dta.R dta_set_column
    notes: >
      Before the fix, every save rebuilt the column's DTAColumnSpec from the
      form's fields alone, so a column carrying examples or a colclass -- set
      by importing a specification written outside the app -- lost them the
      first time anyone touched that column in the editor, without the form
      ever showing what was about to be dropped.

  - id: REQ-APP-021
    text: >
      A group-condition or group-constraint row removed with the rule
      editor's own remove control shall be excluded from the rule that
      results from Save, even when the row was filled in before it was
      removed; only the rows still present shall be saved.
    risk: medium
    category: functional
    covers: [run_dta_app]
    source: inst/shiny/dta_app/app.R (gcond_remove_/gconstr_remove_ observers)
    notes: >
      Before the fix, a row's inputs stayed registered after removal, and the
      save path iterated every index up to the row count rather than the
      rows still present, so a removed-but-once-filled row was written back
      into the saved rule as if it had never been removed.

  - id: REQ-APP-022
    text: >
      In edit mode, the metadata editor shall update study identifiers and
      the documented additional transmission text fields. Empty input shall
      remove a field. Other metadata, custom transmission extensions,
      datasets and loaded data shall be retained. Read-only mode shall reject
      mutation events, not merely hide their controls.
    risk: high
    category: integrity
    covers: [run_dta_app]
    source: inst/shiny/dta_app/app.R; inst/shiny/dta_app/R/utils_dta.R

  - id: REQ-APP-023
    text: >
      The metadata editor shall add, edit, delete with confirmation and
      reorder agreement sections by stable identifier. Edits shall preserve
      unchanged sections and paragraph breaks. Invalid section identifiers,
      duplicates or malformed records shall report an error and leave the
      existing document unchanged. Read-only mode shall prevent section
      mutation, and displayed section text shall not execute HTML.
    risk: high
    category: integrity
    covers: [run_dta_app]
    source: inst/shiny/dta_app/app.R; inst/shiny/dta_app/R/utils_dta.R

  - id: REQ-APP-024
    text: >
      A creation-template text or textarea option with source suggestions that
      permits custom values shall remain editable as free text (a one-line text
      input, or multiline text for a textarea) and render a separate suggestion
      selector including "(leave blank)". Selecting a suggestion or blank shall
      update the original option input and dispatch its bubbling input event so
      the existing option-collection path receives the selected text or empty
      value, never the UI sentinel.
    risk: medium
    category: functional
    covers: [run_dta_app]
    source: inst/shiny/dta_app/R/template_ui.R render_template_option_input()
    notes: >
      PINNED AS STRUCTURAL, NOT BROWSER-DRIVEN: the application test harness
      has no JavaScript engine. The rendered selector, original text or
      textarea input ID, blank mapping, and bubbling input event are checked
      structurally; the developer suite separately verifies the rendered
      control's source suggestions and editable input.

  - id: REQ-APP-025
    text: >
      A creation template with structural variants shall require an explicit
      declared choice before building datasets or showing variant-specific
      agreement controls. Its choice shall replace the dataset list and merge
      metadata defaults and options over the inherited definition, without
      leaking another variant's suggestions. Missing or unsupported choices
      shall fail without creating a document. Provenance shall record the
      selected variant and source revision and retain them through YAML.
      Each selected dataset shall retain its explicit identifier separately
      from its human-readable name.
    risk: high
    category: integrity
    covers: [run_dta_app, validate_template]
    source: inst/shiny/dta_app/R/template_core.R; inst/shiny/dta_app/app.R

  - id: REQ-APP-026
    text: >
      Saving a column, removing a column, saving a rule or removing a rule
      shall, for a dataset that has data bound, re-validate that data against
      the edited specification and report the dataset as pass or fail, rather
      than leaving it at pending. A dataset with no data bound shall stay
      nodata and no validation shall run. Reordering columns shall not
      re-validate. A column edit that DTAColumnSpec() refuses, because its
      declared values cannot fit it, shall leave the document and the dataset's
      status unchanged and report the error.
    risk: high
    category: functional
    covers: [run_dta_app]
    source: inst/shiny/dta_app/app.R (recheck_dataset)
    notes: >
      Before the fix an edit reset the dataset to pending and waited for the
      user to press check, so a dataset could read pending for data whose
      verdict the new specification already decided. Only the columns and rules
      editors are covered here; applying edited raw YAML re-validates by the
      same mechanism and is exercised by the developer suite.

  - id: REQ-APP-027
    text: >
      An IF or THEN condition row of a conditional (col_condition) rule removed
      with the rule editor's own remove control shall be excluded from the rule
      that results from Save, even when the row was filled in before it was
      removed; only the rows still present shall be saved.
    risk: medium
    category: functional
    covers: [run_dta_app]
    source: inst/shiny/dta_app/app.R (cond_remove_/then_remove_ observers)
    notes: >
      Before this change the IF and THEN lists could grow but offered no way
      to remove a row.

  - id: REQ-APP-028
    text: >
      Removing a column from the column editor shall be refused, and the
      document left unchanged, while any rule of the dataset uses that column.
      A column no rule uses shall still be removed.
    risk: high
    category: integrity
    covers: [run_dta_app]
    source: inst/shiny/dta_app/R/utils_dta.R (dta_remove_column); inst/shiny/dta_app/app.R (col_del_click)

  - id: REQ-APP-029
    text: >
      Saving a column under a new id from the column editor shall rename the
      column in every rule of the dataset that uses it, in the same save, so
      that the saved document has no rule naming the old id and lint_dta()
      reports nothing for it.
    risk: high
    category: integrity
    covers: [run_dta_app, lint_dta]
    source: inst/shiny/dta_app/R/utils_dta.R (dta_set_column)

  - id: REQ-APP-030
    text: >
      Applying edited raw YAML whose rules contradict its columns shall be
      refused: the document held by the application shall be unchanged, the
      refusal shall carry the lint_dta() error findings, and the same text
      with the contradiction removed shall apply.
    risk: high
    category: integrity
    covers: [run_dta_app, lint_dta]
    source: inst/shiny/dta_app/app.R (apply_yaml); inst/shiny/dta_app/R/utils_dta.R (dta_lint)
  - id: REQ-APP-031
    text: >
      The Left/IF and Right/THEN selectors of a group-condition rule's
      constraints shall offer exactly the distinct, non-blank names of the
      condition rows still present in the rule editor. A condition row removed
      with the editor's own remove control shall stop being offered as soon as
      it is removed, by the existing constraint rows and by a constraint row
      added afterwards.
    risk: medium
    category: functional
    covers: [run_dta_app]
    source: inst/shiny/dta_app/app.R (current_group_condition_names)
    notes: >
      Before the fix a removed row's name stayed selectable, because Shiny
      keeps a removed input's last value, and choosing it made Save fail with
      an unknown-condition error. PINNED STRUCTURALLY: the application harness
      has no browser, so the test records the selector updates the server
      sends instead of reading a rendered dropdown.

  - id: REQ-APP-032
    text: >
      When header_tag.label is set in the application configuration, the brand
      bar shown above every page shall show that label, HTML-escaped, beside
      the application title. When header_tag.color is set, the label shall be
      drawn on that colour with a text colour whose WCAG 2.x contrast ratio
      against it is at least 4.5:1. When no label is set the brand bar shall
      show no tag.
    risk: medium
    category: functional
    covers: [run_dta_app]
    source: >
      inst/shiny/dta_app/R/ui_components.R (header_tag_ui, brandbar_ui);
      inst/shiny/dta_app/R/theme.R (bi_ink_on);
      inst/shiny/dta_app/app.R (ui_page);
      inst/extdata/template-repo-skeleton/README.md (section header_tag)
    notes: >
      The tag states a deployment's regulatory status (for example GxP), so a
      label that is missing, unescaped or unreadable on its colour misleads the
      reader of every page. PINNED STRUCTURALLY, like REQ-APP-013: the brand
      bar is static page chrome outside the server function, which
      shiny::testServer() never renders, so the test renders the UI function
      itself and reads the HTML.

  # ---- matrix datasets in the application ------------------------------------

  - id: REQ-APP-033
    text: >
      Saving a document that holds a dataset of type matrix shall write the
      dataset's row-label column specifications under the key row_labels, in
      the order declared, and its matrix settings under the key matrix, and
      shall write no columns key for it. The header of a row label shall be
      written as it was declared: absent when absent, the text when a text
      (an empty text and the texts named and blank included), and the plain
      YAML boolean No when the header line has no field above the row label,
      so that reading the saved text back yields a dataset with the same row
      labels and the same header of each, and saving that dataset again shall
      give the identical text.
    risk: high
    category: integrity
    covers: [run_dta_app, read_dta_from_yaml]
    source: >
      PLAN-matrix-dataset.md 4.6, T1; PLAN-matrix-format-review.md 2, 3;
      inst/shiny/dta_app/R/utils_dta.R (dta_dataset_to_list, .dta_compact)
    notes: >
      The application drops empty entries recursively before it writes YAML;
      an empty header text must not be dropped with them (it would become the
      row label's id), and No must stay a boolean, not become a text.

  - id: REQ-APP-034
    text: >
      A matrix dataset's recorded header, the raw header fields of each table
      loaded with load_file(), shall survive the application's session dump and
      restore: after a dump written with saveRDS() and read back, the restored
      dataset shall hold the same recorded header for the table, and checking
      it shall find no missing-header or load-it-again finding.
    risk: high
    category: integrity
    covers: [run_dta_app, load_file, check]
    source: >
      PLAN-matrix-dataset.md D13, 4.7, T10;
      inst/shiny/dta_app/R/utils_dta.R (dta_dump_session, dta_restore_session)
    notes: >
      PINNED STRUCTURALLY through the dump and restore helpers, which the
      restore button calls: the harness has no browser to press it.

  - id: REQ-APP-035
    text: >
      Applying edited raw YAML that changes the matrix block of a dataset with
      loaded data shall re-validate that dataset without the user pressing
      check, so that its verdict and findings reflect the new settings, and
      shall leave the verdict of a dataset whose settings did not change as it
      was.
    risk: high
    category: integrity
    covers: [run_dta_app]
    source: >
      PLAN-matrix-dataset.md T15;
      inst/shiny/dta_app/R/utils_dta.R (dta_specs_signature)
    notes: >
      A verdict reached against one matrix block and shown against another
      would be a pass on settings nobody wrote.

  - id: REQ-APP-036
    text: >
      Applying edited raw YAML that changes the type of one dataset shall drop
      that dataset's bound tables, recorded headers and upload records and
      leave it in the no-data state, and shall leave the bound tables, upload
      records, recorded headers and verdicts of every other dataset
      unchanged.
    risk: high
    category: integrity
    covers: [run_dta_app]
    source: >
      PLAN-matrix-dataset.md T10;
      inst/shiny/dta_app/R/utils_dta.R (dta_transfer_bound_data)
    notes: >
      A table bound under one type read as another would be judged by
      specifications it was never loaded against.

  - id: REQ-APP-037
    text: >
      Applying edited raw YAML that changes whether the first row label of a
      matrix dataset with a loaded table has a field in the header line (for
      example header: No in place of a text), so that the header line the
      table was loaded with no longer fits, shall not raise: the next check shall report the
      dataset as failing, with a finding telling the user to load the file
      again, because the recorded header no longer yields the table's column
      names under the new specification.
    risk: high
    category: integrity
    covers: [run_dta_app, check, messages]
    source: PLAN-matrix-dataset.md D13, T11; REQ-MATRIX-045

  - id: REQ-APP-038
    text: >
      Unloading one table of a matrix dataset shall drop that table's recorded
      header and keep the recorded headers of the dataset's other tables;
      unloading every table shall drop every recorded header.
    risk: medium
    category: integrity
    covers: [run_dta_app]
    source: >
      PLAN-matrix-dataset.md 4.7, T10;
      inst/shiny/dta_app/R/utils_dta.R (dta_unload_table, dta_unload_all,
      dta_drop_provenance)
    notes: >
      PINNED STRUCTURALLY through the unload helpers the remove-file control
      calls: the harness has no browser to press it.

  - id: REQ-APP-039
    text: >
      The application shall list matrix among the dataset types it supports,
      beside tabular and file, and for a dataset of type matrix shall offer
      only csv and tsv as the type of a file entry, while tabular datasets
      keep csv, tsv, sas7bdat and xpt and file datasets any type.
    risk: medium
    category: functional
    covers: [run_dta_app]
    source: >
      PLAN-matrix-dataset.md D11, D12;
      inst/shiny/dta_app/R/utils_dta.R (dta_supported_types, dta_handler_types)
    notes: >
      PINNED STRUCTURALLY: the offered types are read from the helpers that
      build the dropdown, not from a rendered dropdown.

  - id: REQ-APP-040
    text: >
      A specification with matrix datasets loaded into the application, with a
      file bound to each, shall validate: a conforming delivery shall be
      reported as passing, and a delivery with a cell below the declared
      minimum shall be reported as failing, with one finding of keyword minimum
      at the row and column of that cell, which the application shall allow the
      user to inspect, the inspected row showing the offending value.
    risk: high
    category: functional
    covers: [run_dta_app, check, messages]
    source: PLAN-matrix-dataset.md D1, 3.5; REQ-MATRIX-039

  - id: REQ-APP-041
    text: >
      Adding a dataset of type matrix shall require a row-label column ID, a
      choice of the header text above that row label (the ID, an empty field,
      another text, or no field) and a cell type, and shall refuse the addition
      when the ID, the choice or the cell type is missing, or when another text
      is chosen and left blank, or when the cell type is not one of SAS Num,
      SAS Int, SAS Char, R numeric, R integer and R character (a logical, date
      or time type, a type written without its SAS or R in front and a type
      system the package does not have being refused); a refused addition
      leaves the document unchanged. The dataset added shall be a matrix whose
      single row-label column carries the given ID, is of the text type of the
      chosen cell type's type system (SAS Char for a SAS cell type, R character
      for an R one), is not nullable and is the row key, whose header is the
      one chosen (no header key for the ID, "" for an empty field, the text, No
      for no field) and whose cell type is the one chosen, and which requires
      at least one data column and at least one data row.
    risk: high
    category: functional
    covers: [run_dta_app]
    source: >
      PLAN-matrix-shiny.md 2.1; PLAN-matrix-format-review.md 3 (App);
      inst/shiny/dta_app/R/utils_dta.R (dta_add_dataset)
    notes: >
      The cell types a matrix can hold are the number, integer and text types
      of either type system (REQ-MATRIX-060). What the dialog offers, as
      against what the application accepts, is REQ-APP-056.

  - id: REQ-APP-042
    text: >
      Editing the row-label columns of a matrix dataset shall keep the dataset
      valid and shall leave the header text of every other row label
      unchanged: renaming a row-key column shall rename it in the row key;
      adding a row label, removing one that is not the row key or moving one
      shall not change the header declared on any other row label; removing
      the row-key column shall be refused; choosing no field above a row label
      that is not the first, and moving the first row label away from first
      place (or another row label into it) while the first has no field above
      it, shall each be refused; every refusal shall leave the dataset
      unchanged.
    risk: high
    category: integrity
    covers: [run_dta_app]
    source: >
      PLAN-matrix-shiny.md 2.2; PLAN-matrix-format-review.md 3 (App);
      inst/shiny/dta_app/R/utils_dta.R (dta_set_column, dta_remove_column,
      dta_move_column)

  - id: REQ-APP-043
    text: >
      The matrix-layout editor shall save the data-column, row and cell
      settings entered for a matrix dataset into its specification and shall re-validate
      the dataset; saving it without changes shall leave the matrix settings
      unchanged; an entry whose minimum exceeds its maximum shall be refused
      and shall leave the dataset unchanged.
    risk: high
    category: functional
    covers: [run_dta_app]
    source: >
      PLAN-matrix-shiny.md 2.4; PLAN-matrix-format-review.md 3 (App);
      inst/shiny/dta_app/R/utils_dta.R (dta_matrix_fields, dta_set_matrix)

  - id: REQ-APP-044
    text: >
      The rules of a matrix dataset shall be editable on its row-label
      columns, and a rule whose ID starts with .matrix: shall be refused,
      because that prefix is reserved for the checks the matrix layout
      generates.
    risk: medium
    category: functional
    covers: [run_dta_app]
    source: >
      PLAN-matrix-shiny.md 2.3;
      inst/shiny/dta_app/R/utils_dta.R (dta_set_rule)

  - id: REQ-APP-045
    text: >
      Inspecting a finding that a matrix has fewer data rows than declared
      shall state the declared minimum number of data rows and the actual
      number of data rows.
    risk: medium
    category: functional
    covers: [run_dta_app]
    source: >
      PLAN-matrix-shiny.md 2.5;
      inst/shiny/dta_app/app.R (render_inspect_body)

  - id: REQ-APP-046
    text: >
      A file the application refuses to load into a dataset shall be listed in
      that dataset's validation messages with the reason, until a file loads in
      its place. Removing a file entry of a matrix dataset in the editor, or
      reordering its file entries in raw YAML, shall not make a table already
      loaded from a remaining entry fail as changed.
    risk: high
    category: integrity
    covers: [run_dta_app]
    source: >
      PLAN-matrix-shiny.md 2.6, 2.7;
      inst/shiny/dta_app/R/utils_dta.R (dta_load_errors_add,
      dta_remap_file_handlers, dta_transfer_bound_data)
    notes: >
      A reason that vanishes after ten seconds is not evidence, and a false
      "changed" failure blocks a conforming delivery.

  - id: REQ-APP-047
    text: >
      The row-label form of a matrix dataset shall carry the header text above
      the row label as a choice of the ID, an empty field, another text or no
      field, with the text: the values the application reads for a row label
      shall report the choice and text that its header declares, and saving the
      form shall declare exactly that header on the row label, leaving the
      row label's other settings unchanged.
    risk: medium
    category: functional
    covers: [run_dta_app]
    source: >
      PLAN-matrix-format-review.md 3 (App);
      inst/shiny/dta_app/R/utils_dta.R (dta_column_fields, dta_set_column)

  - id: REQ-APP-048
    text: >
      For a matrix dataset the application shall hold a two-line sketch of the
      file the dataset describes, which it shows above the row-label list and
      above the matrix-layout form. The second line shall hold the row-label
      IDs in file order, followed by placeholders for the cells. The first line
      shall hold, above each row-label ID, the header text expected there: the
      ID when the row label declares no header, the declared text, two double
      quotes for an empty field, and nothing where the header line has no
      field -- in which case the line shall end with a note naming the row
      label that has no field above it -- followed by placeholders for the
      data-column labels. The row-label list shall carry the header of each
      row label in a column named header: the expected text, "(empty)" for an
      empty field and "(no field)" for none. A dataset of another type shall
      have no sketch, and its column list no header column.
    risk: low
    category: interface
    covers: [run_dta_app]
    source: >
      PLAN-matrix-format-review.md 3 (App), 6;
      inst/shiny/dta_app/R/utils_dta.R (dta_matrix_sketch, dta_columns_overview)

  - id: REQ-APP-049
    text: >
      After an edit of the row labels of a matrix dataset that has a loaded
      table, the application shall tell the user to load the file again exactly
      when the edit makes that table stale: when it changes the row-label IDs
      or their order (a rename, an added, a removed or a moved row label) or
      whether the header line has a field above the first row label. An edit
      that changes neither (another header text, another constraint), an edit
      of a matrix with no table loaded and an edit of a dataset of another
      type shall not.
    risk: medium
    category: interface
    covers: [run_dta_app]
    source: >
      PLAN-matrix-format-review.md 6;
      inst/shiny/dta_app/R/utils_dta.R (dta_matrix_needs_reload)

  - id: REQ-APP-050
    text: >
      The application shall act on a file-input value only when it is a data
      frame in which every file path names a file that exists and is not a
      directory, located at
      <R session temporary directory>/<24 lowercase hexadecimal
      characters>/<digits>[.<alphanumeric extension>]. For any other value (not
      a data frame, a path outside such a folder, a directory, a file that does
      not exist) it shall read nothing, load nothing and leave the loaded
      document unchanged.
    risk: high
    category: security
    covers: [run_dta_app]
    source: >
      inst/shiny/dta_app/R/utils_dta.R (dta_upload_value_problem,
      dta_stage_upload); inst/shiny/dta_app/app.R (accept_upload)
    notes: >
      A file input's value carries a server path, and a client that writes the
      value itself could name any readable file. The application additionally
      refuses any value that arrived as a client input message.
      shiny::testServer cannot deliver one, so that binding rests on the
      developer suite's wiring and Shiny-contract tests
      (tests/testthat/test-shinyapp-upload-guard.R) and on a browser run, not on
      this suite. This requirement is verified here for the value itself.

  # ---- the two type systems in the application (data_types.default) ----------
  #
  # A column's declared type is written with its type system in front (SAS Num,
  # R numeric; REQ-TYPE-003). The key data_types.default of a library's
  # dta-app.yaml names the type system the application preselects for NEW
  # columns and new matrix cells, SAS or R. It hides nothing: both are always
  # on offer, a column or matrix that exists keeps its own, and a type written
  # in YAML keeps its mandatory prefix. The requirements below are the
  # application's side of REQ-TMPL-064, which covers the file.

  - id: REQ-APP-051
    text: >
      When data_types.default of the application configuration is R, the column
      editor opened for a new column of a tabular dataset shall preselect the
      backend R and the type character, shall list character, numeric,
      integer, logical, Date, POSIXct and hms as the choice of type, and shall
      show a format placeholder that gives an R format (%Y-%m-%d). When it is
      SAS, when the configuration sets no data_types.default and when there is
      no configuration file, the editor shall preselect the backend SAS and
      the type Char, shall list Char, Num, Int, Date, Time and DateTime, and
      shall show a placeholder that gives a SAS format ($9. or 8.2). Whichever
      is preselected, the choice of backend shall offer both SAS and R.
    risk: high
    category: functional
    covers: [run_dta_app]
    source: >
      inst/shiny/dta_app/app.R (col_modal_body); inst/shiny/dta_app/R/utils_dta.R
      (dta_default_backend, dta_backend_types, dta_text_type,
      dta_format_placeholder); inst/shiny/dta_app/R/app_config.R
    notes: >
      The key decides only what a NEW column starts with. The default type is
      the text type of the preselected type system, never the first type of
      the list.

  - id: REQ-APP-052
    text: >
      The application shall read data_types.default as SAS or R, in any letter
      case and with blanks around the value ignored. A value that is neither
      (Python, a number, an empty text, a list) shall be reported as a warning
      that names data_types.default, once, and the application shall then
      start as if the key were absent, with SAS preselected; a valid value
      shall raise no warning.
    risk: medium
    category: functional
    covers: [run_dta_app]
    source: inst/shiny/dta_app/R/app_config.R (.cfg_backend, .dta_app_config_build)
    notes: >
      The application never fails over a bad value of the file, it warns and
      keeps the default (REQ-TMPL-037); validate_template() is what fails the
      library's CI on it (REQ-TMPL-064).

  - id: REQ-APP-053
    text: >
      The column editor opened for an existing column shall show the backend,
      the type, the format and the length the column is declared with,
      whatever data_types.default says, the format without its backend in
      front, and saving the form unchanged shall leave the column's declared
      type and format as they were. A column declared R POSIXct with the
      format R %Y-%m-%dT%H:%M:%S shall open as the backend R, the type POSIXct
      and the format %Y-%m-%dT%H:%M:%S; a column declared SAS Num with the
      format SAS 8.2 as the backend SAS, the type Num and the format 8.2; a
      column declared R character with the length 12 as the backend R, the
      type character and the length 12; each in a configuration that prefers
      SAS and in one that prefers R. A column that declares no type shall open
      with the preselected backend and its text type (REQ-APP-051).
    risk: high
    category: integrity
    covers: [run_dta_app]
    source: >
      inst/shiny/dta_app/app.R (col_edit_click); inst/shiny/dta_app/R/utils_dta.R
      (dta_column_fields)
    notes: >
      Opening a column of one type system under a library that prefers the
      other and saving it must not turn it into the preferred one.

  - id: REQ-APP-054
    text: >
      Changing the Backend in the column editor shall replace the chosen type
      by the other backend's type of the same kind (Char and character, Num and
      numeric, Int and integer, Date and Date, DateTime and POSIXct, Time and
      hms), shall list the new backend's types as the choice of type, shall
      empty the Format whatever it held, because a SAS format and an R format
      are not interchangeable, shall keep the Length when the new type is Char
      or character and empty it when the new type is an R type other than
      character, and shall keep every other entry of the form (the ID, the
      label, whether the column is nullable, its description). R logical, which
      has no SAS counterpart, shall become SAS Char, and the application shall
      show a notice that names logical and SAS Char. Asking for the backend the
      form already holds shall change nothing.
    risk: high
    category: functional
    covers: [run_dta_app]
    source: >
      inst/shiny/dta_app/R/utils_dta.R (dta_switch_backend,
      dta_backend_type_map); inst/shiny/dta_app/app.R (input$col_backend)
    notes: >
      What becomes of a Length held across a switch to a SAS type other than
      Char is not specified here: the application empties it, and an entry
      typed against an R type other than character was refused there in any
      case (REQ-TYPE-016).

  - id: REQ-APP-055
    text: >
      The column editor shall show, whatever inputs the browser last reported
      for it, the backend, type and format of the column it was opened for or,
      for a new column of a tabular dataset, the preselected backend and its
      text type (REQ-APP-051): the values of a previously edited column that
      the browser still holds, and the report the browser sends of the form it
      has just been given, shall neither change the type shown nor empty the
      format of the column opened. Closing the editor and opening it again for
      a new column shall show the preselected backend and its text type again,
      not those of the column edited last.
    risk: high
    category: integrity
    covers: [run_dta_app]
    source: >
      inst/shiny/dta_app/app.R (col_modal_body, input$col_backend,
      col_shown_backend)
    notes: >
      Shiny reports a re-opened dialog's previous values first and a rendered
      select's value as a change; an application that took either for a choice
      of the user would save a SAS format under an R type, or a column of the
      wrong type system.

  - id: REQ-APP-056
    text: >
      The Add dataset dialog shall offer as the cell type of a matrix dataset
      SAS Num (decimal numbers), SAS Int (whole numbers) and SAS Char (text)
      when data_types.default is SAS or not set, and R numeric (decimal
      numbers), R integer (whole numbers) and R character (text) when it is R,
      and no type of the other type system; none of the types offered shall be
      preselected.
    risk: medium
    category: functional
    covers: [run_dta_app]
    source: >
      inst/shiny/dta_app/app.R (add_ds_body); inst/shiny/dta_app/R/utils_dta.R
      (dta_matrix_cell_types)
    notes: >
      A matrix whose cells are written in the other type system is made in the
      raw YAML editor or in a template, or by sending the cell type from
      another client, which REQ-APP-041 accepts (LIM-033).

  - id: REQ-APP-057
    text: >
      The matrix-layout editor shall offer as the cell type the three types of
      the type system the matrix's cell type is written in, whatever
      data_types.default says (SAS Num, SAS Int and SAS Char for a matrix of SAS
      cells; R numeric, R integer and R character for a matrix of R cells), and
      no type of the other system, with the matrix's own cell type chosen, and
      for a matrix of R cells it shall offer no field for a format, which R
      cells do not take, where a matrix of SAS cells keeps its SAS format
      field. Saving the layout of an R matrix, whatever else was
      changed, shall keep the cell type written with the prefix R (R numeric,
      never SAS R numeric) and every cell setting that was not edited, and
      shall give its cells no format, also when the layout form of a SAS
      matrix opened earlier reported one; choosing another of the three types
      shall write that type with the same prefix.
    risk: high
    category: integrity
    covers: [run_dta_app]
    source: >
      inst/shiny/dta_app/app.R (mx_modal_body, mx_save);
      inst/shiny/dta_app/R/utils_dta.R (dta_matrix_fields, dta_set_matrix)
    notes: >
      Before the R type system, every cell type was written back as SAS and
      the prefix of a saved type was rewritten, so an R layout could not be
      saved. Nothing the form offers changes a matrix from one type system to
      the other (LIM-033).

  - id: REQ-APP-058
    text: >
      A row label added to a matrix dataset in the column editor shall be
      preselected with the type system the matrix's cell type is written in and
      that system's text type (SAS Char or R character), whatever
      data_types.default says, and the choice of backend shall still offer both
      SAS and R; a column added to a tabular dataset shall be preselected as
      REQ-APP-051 says, also in a document that holds matrix datasets.
    risk: medium
    category: functional
    covers: [run_dta_app]
    source: >
      inst/shiny/dta_app/app.R (col_add); inst/shiny/dta_app/R/utils_dta.R
      (dta_matrix_backend)
    notes: >
      A matrix of R cells with a SAS row label is allowed but is not what an
      author who added a row label to it means.

  - id: REQ-APP-059
    text: >
      The column choice of a range rule shall list the columns of the dataset
      declared with a number or an integer type of either type system (SAS
      Num, SAS Int, R numeric, R integer) and no column declared with a text,
      date, time or logical type (SAS Char, SAS Date, SAS Time, SAS DateTime,
      R character, R logical, R Date, R POSIXct, R hms).
    risk: medium
    category: functional
    covers: [run_dta_app]
    source: >
      inst/shiny/dta_app/R/utils_dta.R (dta_numeric_column_ids);
      inst/shiny/dta_app/app.R (rule_col_single)
    notes: >
      The picker decides by what kind of value the type holds, so an R numeric
      column is offered as a SAS Num one is and an R character one is not;
      lint_dta() refuses a range rule on an R logical column all the same
      (REQ-SPEC-036).

  - id: REQ-APP-060
    text: >
      The specification text the application saves shall write the type of each
      column with its type system in front (SAS Num, R numeric), a format with
      its type system in front (SAS 8.2, R %Y-%m-%dT%H:%M:%S) and, for an R
      Date, R POSIXct or R hms column that names no format, the format of its
      type (R %Y-%m-%d, R %Y-%m-%d %H:%M:%S, R %H:%M:%S; REQ-TYPE-016). Reading
      the saved text back shall give the same declared type and format for
      every column, and saving that document again shall give the identical
      text. A column added in the editor as R Date with the Format left empty
      shall be saved with the format R %Y-%m-%d.
    risk: high
    category: integrity
    covers: [run_dta_app, read_dta_from_yaml]
    source: >
      inst/shiny/dta_app/R/utils_dta.R (dta_to_yaml_text, dta_column_to_list,
      dta_set_column); R/DTAColumnSpecStructureR-class.R
    notes: >
      The application cannot make an R Date, POSIXct or hms column without a
      format: the one the author did not write is stored and then written
      (LIM-034).
