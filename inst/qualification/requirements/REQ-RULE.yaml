area: RULE
title: Cross-column and grouped rules

# The largest surface in the package and the one with the most edge cases.
# Every operator has to decide what a missing value means, and a wrong answer
# there is invisible: the delivery simply passes.

requirements:
  # ---- the operator vocabulary ----------------------------------------------

  - id: REQ-RULE-001
    text: >
      A conditional clause shall accept exactly the operators equals, equal,
      not_equals, not_equal, in, not_in, greater, less, greater_equal,
      less_equal, min, max, range, pattern and empty, and shall reject any
      other operator with a condition naming the supported set.
    risk: high
    category: interface
    covers: [DTARuleColCondition, rule_check_col_condition]
    source: R/evaluateRules.R dta_condition_operators()

  - id: REQ-RULE-002
    text: >
      The equality operators equals and not_equals, and their aliases equal and
      not_equal, shall compare a value with a single expected value.
    risk: high
    category: functional
    covers: [rule_check_col_condition]
    source: R/evaluateRules.R

  - id: REQ-RULE-003
    text: >
      The set operators in and not_in shall test membership of a list of
      permitted values.
    risk: high
    category: functional
    covers: [rule_check_col_condition]
    source: R/evaluateRules.R

  - id: REQ-RULE-004
    text: >
      The ordering operators greater, less, greater_equal and less_equal shall
      compare numerically, with greater_equal and less_equal including the
      bound and greater and less excluding it.
    risk: high
    category: functional
    covers: [rule_check_col_condition]
    source: R/evaluateRules.R

  - id: REQ-RULE-005
    text: >
      min and max given together shall select one inclusive band rather than
      two independent tests.
    risk: high
    category: functional
    covers: [rule_check_col_condition]
    source: R/evaluateRules.R
    notes: >
      Treating them as two tests would make a row satisfying only one of them
      count as in scope, silently widening every banded rule.

  - id: REQ-RULE-006
    text: >
      The range operator shall select the inclusive band between the first and
      second elements of its value.
    risk: high
    category: functional
    covers: [rule_check_col_condition, rule_check_range]
    source: R/evaluateRules.R

  - id: REQ-RULE-007
    text: >
      The pattern operator shall match a PCRE regular expression, and shall
      treat a missing value and an empty string as not matching.
    risk: high
    category: functional
    covers: [rule_check_col_condition]
    source: R/evaluateRules.R (dta_pattern_mask)
    notes: >
      Not matching holds whatever the expression: ^$ and .* select neither, so
      a pattern in a THEN clause counts both as violations, as it counts a
      missing value for every operator, and a pattern in an IF clause leaves
      their rows out of scope. Text of spaces only is not an empty string; the
      empty operator (REQ-RULE-008) is the one that treats blanks as empty. A
      column's own pattern (REQ-VAL-009) is a separate check, and an empty
      string is a value there (LIM-036). A file never delivers an empty string,
      because an empty field is read as missing (REQ-FILE-004); the case is a
      table built in R. Until the operator was brought into line with this
      statement an empty string matched like any other text, and the case that
      claimed to verify it ran ^$ on a column holding no empty string (DEV-019).

  - id: REQ-RULE-008
    text: >
      The empty operator shall treat a missing value as empty in every column,
      and a blank string as empty in character and factor columns; empty = TRUE
      shall select the empty values and empty = FALSE the rest.
    risk: high
    category: functional
    covers: [rule_check_col_condition]
    source: R/evaluateRules.R

  - id: REQ-RULE-009
    text: >
      A bound that parses as a number shall be compared numerically against a
      numeric column, so that a value stored as a double and the same value
      stored as an integer reach the same verdict.
    risk: high
    category: functional
    covers: [rule_check_col_condition]
    source: R/evaluateRules.R
    notes: >
      Left to R's implicit coercion the comparison would render the column as
      text, and the verdict would then depend on integer-versus-double storage
      -- which legitimately differs between the whole-column and streaming
      engines. That would make the same file pass on one path and fail on the
      other.

  - id: REQ-RULE-010
    text: >
      A bound that does not parse as a number, and any comparison against a
      character column, shall be compared as text, so that identifiers with
      leading zeros keep them.
    risk: high
    category: functional
    covers: [rule_check_col_condition]
    source: R/evaluateRules.R

  # ---- conditional rules ------------------------------------------------------

  - id: REQ-RULE-011
    text: >
      A conditional rule shall report a violation for every row where the IF
      clause holds and the THEN clause does not.
    risk: high
    category: functional
    covers: [DTARuleColCondition, rule_check_col_condition]
    source: R/evaluateRules.R

  - id: REQ-RULE-012
    text: >
      Several operators named for one column in an IF clause shall be combined
      conjunctively, and so shall clauses naming several columns.
    risk: high
    category: functional
    covers: [rule_check_col_condition]
    source: R/evaluateRules.R

  - id: REQ-RULE-013
    text: >
      A row whose IF clause cannot be decided because a value is missing shall
      be treated as out of scope rather than as a violation.
    risk: high
    category: functional
    covers: [rule_check_col_condition]
    source: R/evaluateRules.R

  # ---- range rules ------------------------------------------------------------

  - id: REQ-RULE-014
    text: >
      A range rule shall report every value outside its inclusive bounds, and
      shall accept its bounds either as a range of two values or as separate
      min and max values. The two bounds may be equal; a lower bound greater
      than the upper bound shall be refused with a condition of class
      dta_rule_invalid_range. Giving a range together with min or max shall
      be refused with a condition of class dta_rule_range_conflict.
    risk: high
    category: functional
    covers: [DTARuleColRange, rule_check_range]
    source: R/evaluateRules.R

  - id: REQ-RULE-015
    text: >
      A range rule shall ignore missing values rather than report them.
    risk: high
    category: functional
    covers: [rule_check_range]
    source: R/evaluateRules.R

  - id: REQ-RULE-016
    text: >
      A range rule shall require exactly one target column, and shall raise a
      condition when given none or several: a rule naming several columns is
      refused when it is constructed, with the condition class
      dta_rule_range_columns.
    risk: medium
    category: interface
    covers: [DTARuleColRange, rule_check_range]
    source: R/evaluateRules.R

  - id: REQ-RULE-017
    text: >
      A range rule shall raise a condition of class dta_rule_not_applicable
      when its target column is absent from the table.
    risk: high
    category: functional
    covers: [rule_check_range]
    source: R/evaluateRules.R
    notes: >
      A distinct class matters: a rule that cannot be evaluated is not a rule
      that passed, and a caller must be able to tell the two apart.

  # ---- uniqueness rules -------------------------------------------------------

  - id: REQ-RULE-018
    text: >
      A uniqueness rule shall report duplicate rows across the combination of
      all its named columns, not each column separately.
    risk: high
    category: functional
    covers: [DTARuleColUnique, rule_check_unique]
    source: R/evaluateRules.R

  - id: REQ-RULE-019
    text: >
      A uniqueness rule shall treat repeated missing values as duplicates of
      one another.
    risk: high
    category: functional
    covers: [rule_check_unique]
    source: R/evaluateRules.R
    notes: >
      Pinned as observed. It follows base R's duplicated(), and it is the
      stricter reading, but it is not the only defensible one: a key of unknown
      value is arguably not equal to another key of unknown value.

  - id: REQ-RULE-020
    text: >
      A uniqueness rule shall compare values case-sensitively.
    risk: medium
    category: functional
    covers: [rule_check_unique]
    source: R/evaluateRules.R

  - id: REQ-RULE-021
    text: >
      A uniqueness rule shall raise a condition of class
      dta_rule_not_applicable when any of its columns is absent.
    risk: high
    category: functional
    covers: [rule_check_unique]
    source: R/evaluateRules.R

  # ---- grouped rules ----------------------------------------------------------

  - id: REQ-RULE-022
    text: >
      A grouped rule shall partition the table by all of its grouping columns
      and evaluate its constraints once per group.
    risk: high
    category: functional
    covers: [DTARuleGroupCondition, rule_check_group_condition]
    source: R/evaluateRules.R

  - id: REQ-RULE-023
    text: >
      The mutually_exclusive constraint shall report a group in which both of
      its named conditions hold.
    risk: high
    category: functional
    covers: [rule_check_group_condition]
    source: R/evaluateRules.R

  - id: REQ-RULE-024
    text: >
      The requires constraint shall report a group in which its antecedent
      condition holds and its consequent does not.
    risk: high
    category: functional
    covers: [rule_check_group_condition]
    source: R/evaluateRules.R

  - id: REQ-RULE-025
    text: >
      Constraint types shall be accepted under the aliases not_both for
      mutually_exclusive and implies for requires.
    risk: low
    category: interface
    covers: [DTARuleGroupCondition]
    source: R/DTARuleGroupCondition-class.R

  - id: REQ-RULE-026
    text: >
      A constraint of an unrecognised type, or one naming a condition the rule
      does not define, shall be rejected when the rule is constructed rather
      than ignored when it is evaluated.
    risk: high
    category: interface
    covers: [DTARuleGroupCondition]
    source: R/DTARuleGroupCondition-class.R
    notes: >
      Rejecting at construction is what stops a mistyped constraint from
      reading as a rule that always passes. A rule that silently checks nothing
      is indistinguishable from a delivery that is clean.

  - id: REQ-RULE-027
    text: >
      A grouped rule shall raise a condition of class dta_rule_not_applicable
      when a grouping column is absent from the table.
    risk: high
    category: functional
    covers: [rule_check_group_condition]
    source: R/evaluateRules.R

  - id: REQ-RULE-028
    text: >
      A reported group violation shall name the group it occurred in and the
      rows that produced it.
    risk: medium
    category: interface
    covers: [rule_check_group_condition]
    source: R/evaluateRules.R

  # ---- rules as a set ---------------------------------------------------------

  - id: REQ-RULE-029
    text: >
      apply_rules() shall evaluate every rule in a specification and return one
      result per rule, whether or not earlier rules failed.
    risk: high
    category: functional
    covers: [apply_rules]
    source: R/evaluateRules.R

  - id: REQ-RULE-030
    text: >
      DTARuleFactory() shall build a rule of each of the four documented types
      (col_condition, col_range, col_unique, group_condition), and shall reject
      any other type, including the retired check_range, check_unique,
      check_col_condition and check_group_condition spellings, and any
      argument that is not an exact argument of the type's constructor.
    risk: medium
    category: interface
    covers: [DTARuleFactory]
    source: R/DTARule-class.R

  - id: REQ-RULE-031
    text: >
      rule_preview() shall summarise the rules of a specification as their
      identifiers, abbreviating the middle of a long list, and shall report a
      specification with no rules as "not set".
    risk: low
    category: interface
    covers: [rule_preview]
    source: R/DTAColumnSpecCollection-class.R:158

  - id: REQ-RULE-032
    text: >
      validate_rules() shall raise a condition listing every violated rule when
      any rule of a specification is violated.
    risk: medium
    category: interface
    covers: [validate_rules]
    source: R/evaluateRules.R

  - id: REQ-RULE-033
    text: >
      A conditional rule shall be rejected when it is constructed if any
      operator in its condition or consequent is given the wrong number of
      values: exactly one for equals, not_equals, greater, less,
      greater_equal, less_equal, min, max and pattern (and their aliases),
      exactly two for range, at least one for in and not_in, and a single
      TRUE or FALSE for empty. A missing value does not count as a value for
      the single-value operators or range; a missing member of in or not_in
      is allowed, and matches missing values; an empty YAML entry (~) is a
      missing member.
    risk: high
    category: functional
    covers: [DTARuleColCondition, DTARuleGroupCondition]
    source: R/evaluateRules.R
    notes: >
      The comparisons are element-wise in R, so a wrongly sized value was never
      an error at evaluation time but a silently wrong verdict: equals with two
      values compared row by row with recycling, making the result depend on
      row order, and range with three values dropped the third bound.

  - id: REQ-RULE-034
    text: >
      The operators equals, not_equals, in and not_in (and the aliases equal and
      not_equal), applied to a column holding R logical values, shall read an
      operand written as one of the texts TRUE, T, true, True, FALSE, F, false
      or False, or as a YAML true or false, as that logical value, whatever
      its spelling, so that equals T and equals true select the rows equals
      TRUE selects. An operand that is no logical token shall select no row
      with equals and in and every row holding a value with not_equals, and
      shall not raise a condition. A missing value shall not be selected by
      equals, not_equals or in and shall be selected by not_in, as it is for
      every other column type (REQ-RULE-003).
    risk: high
    category: functional
    covers: [rule_check_col_condition, DTARuleColCondition]
    source: R/evaluateRules.R (dta_logical_bound, dta_equality_bound)
    notes: >
      A numeric operator on the same column reads TRUE as 1 and FALSE as 0
      (LIM-032).

  - id: REQ-RULE-035
    text: >
      Which operand reading a rule applies shall be decided by the values the
      column holds when the rule is evaluated, never by the type its
      specification declares: a column holding text, such as a table that
      nothing has typed, shall be compared as text, so that equals T selects
      the text T and not the text TRUE, and the same column read from a file
      and typed by its declaration R logical shall have equals T select every
      row spelled as a TRUE token.
    risk: high
    category: functional
    covers: [rule_check_col_condition, check, load_file, validation_status]
    source: R/evaluateRules.R (dta_equality_bound); R/importConversion.R
    notes: >
      validate_table() types nothing, so a text column of T and TRUE declared
      R logical is judged as text there; a file loaded by load_file() is typed
      first and judged as logical.

  - id: REQ-RULE-036
    text: >
      A uniqueness rule on a column declared R logical shall count the
      spellings of one logical value as one key, T, TRUE, true and True being
      one key and F, FALSE, false and False another, and every missing value
      a third, with the table held in memory and scanned in batches alike and
      whatever the batch size.
    risk: medium
    category: functional
    covers: [rule_check_unique, check, load_file, validation_status, messages]
    source: R/streamingScale.R (dta_arrow_unique_eligible); R/evaluateRules.R
    notes: >
      The same file with the column declared R character has no duplicate
      among the spellings: T and TRUE are two keys there.

  - id: REQ-RULE-037
    text: >
      The pattern operator shall match a number against its plain decimal
      text, never in scientific notation, so that 100000 is matched as 100000
      and 0.00001 as 0.00001, and a whole number shall reach the same verdict
      held as an integer and as a double, with the table held in memory and
      scanned in batches alike and whatever the batch size.
    risk: high
    category: functional
    covers: [rule_check_col_condition, check, load_file, messages]
    source: R/evaluateRules.R (dta_pattern_mask); R/columnSpecChecks.R (dta_numeric_text)
    notes: >
      R writes the double 100000 as 1e+05 and 0.00001 as 1e-05, and the integer
      100000 as 100000. Matched as R writes them, one pattern gave a column
      read as SAS Int a verdict that the same numbers read as SAS Num did not
      get, because the first is held as integers and the second as doubles
      (DEV-020). The text is the one a column's own pattern is matched against
      (REQ-VAL-009): a whole number in full, a fraction to at most 15
      significant digits, so a fraction that needs more can read as a whole
      number. A value that is not a number (a logical, a date, a factor) is
      matched as the text R writes for it.

  - id: REQ-RULE-038
    text: >
      A group constraint shall carry only the keys of its type, written exactly:
      id, type, message, left, right, left_scope and right_scope for
      mutually_exclusive (alias not_both), and id, type, message, if, then,
      if_scope and then_scope for requires (alias implies). A rule shall be
      refused when it is constructed, with a condition of class
      dta_group_constraint_unknown_key that names every other key, a misspelt
      scope or the scope of the other type included, and a constraint whose
      left, right, if or then is absent shall be refused with a condition of
      class dta_group_constraint_missing_condition; a left_scope with no left
      is therefore a missing left, never a left condition named by the scope.
    risk: high
    category: interface
    covers: [DTARuleGroupCondition]
    source: R/DTARuleGroupCondition-class.R (dta_normalize_group_constraints); thoughts/shared/reviews/2026-11 c1-spec-49
    notes: >
      A scope that was misspelt was read as its default, any, where the author
      wrote all, so the rule enforced something other than what it said and
      nothing said so (REQ-RULE-026 rejects the other mistyped constraints at
      construction for the same reason). A rule whose conditions are read from a
      slot assigned after construction is not normalised and is not covered.
