area: SPEC
title: Specifications, their construction and their accessors

# A Data Transfer Specification is the agreement. Everything the package
# decides about a delivery follows from how that agreement was read, so a
# specification misread is a delivery checked against rules nobody agreed to --
# and the check would look entirely successful while doing it.

requirements:
  # ---- reading a specification ------------------------------------------------

  - id: REQ-SPEC-001
    text: >
      read_dta_from_yaml() shall build a transfer object from a YAML
      specification, carrying its datasets, their column specifications, their
      rules, their file handlers and the transfer metadata.
    risk: high
    category: functional
    covers: [read_dta_from_yaml, DTA]
    source: R/DTA-class.R

  - id: REQ-SPEC-002
    text: >
      read_dataset_from_yaml() shall build a single dataset from a YAML
      specification that describes one.
    risk: high
    category: functional
    covers: [read_dataset_from_yaml, DTADataSet]
    source: R/DTADataSet-class.R

  - id: REQ-SPEC-003
    text: >
      import_specs_from_yaml() shall build a column specification collection
      from a YAML file describing columns and rules.
    risk: high
    category: functional
    covers: [import_specs_from_yaml, DTAColumnSpecCollection]
    source: R/DTAColumnSpecCollection-class.R

  - id: REQ-SPEC-004
    text: >
      The list-based constructors dta_from_list(), dta_dataset_from_list(),
      dta_file_handlers_from_list() and specs_from_list() shall build the same
      objects from an already-parsed specification as the YAML readers build
      from the file.
    risk: high
    category: functional
    covers: [dta_from_list, dta_dataset_from_list, dta_file_handlers_from_list, specs_from_list]
    source: R/DTADataSet-class.R
    notes: >
      The YAML readers parse and then delegate to these, so a difference
      between the two paths would mean the file and its parsed form describe
      different agreements.

  - id: REQ-SPEC-005
    text: >
      A specification that cannot be read shall raise a condition naming what
      is wrong with it, rather than yielding a partial object.
    risk: high
    category: functional
    covers: [read_dta_from_yaml, import_specs_from_yaml]
    source: R/DTA-class.R
    notes: >
      A partially-read specification is the dangerous outcome: the checks it
      does describe would run and report success, and the ones it lost would
      never be missed.

  - id: REQ-SPEC-006
    text: >
      A value written in a specification shall keep the text it was written
      with, so that a code such as 007 is not silently read as the number 7.
    risk: high
    category: integrity
    covers: [import_specs_from_yaml, DTAColumnSpec]
    source: README section "YAML Column Format"

  # ---- constructing a specification directly -----------------------------------

  - id: REQ-SPEC-007
    text: >
      DTAColumnSpec() shall carry a column's identifier, declared type, length,
      nullability, permitted values, pattern, label and description.
    risk: high
    category: interface
    covers: [DTAColumnSpec]
    source: R/DTAColumnSpec-class.R

  - id: REQ-SPEC-008
    text: >
      DTAColumnSpecCollection() shall carry a set of column specifications
      keyed by identifier, together with the rules that apply across them.
    risk: high
    category: interface
    covers: [DTAColumnSpecCollection]
    source: R/DTAColumnSpecCollection-class.R

  - id: REQ-SPEC-009
    text: >
      DTAColumnSpecStructure() and DTAColumnSpecStructureSAS() shall carry a
      column's declared type, format and length, and DTAColumnSpecStructureSAS
      shall infer the type from a SAS format when none is given.
    risk: medium
    category: interface
    covers: [DTAColumnSpecStructure, DTAColumnSpecStructureSAS, DTAColumnSpecStructureFactory]
    source: R/DTAColumnSpecStructureSAS-class.R

  - id: REQ-SPEC-010
    text: >
      The dataset classes DTADataSetTabular and DTADataSetFile shall each carry
      their name, their file handlers and their validation state, and
      DTADataSetFactory() shall build the one its type names.
    risk: high
    category: interface
    covers: [DTADataSet, DTADataSetTabular, DTADataSetFile, DTADataSetFactory]
    source: R/DTADataSet-class.R

  - id: REQ-SPEC-011
    text: >
      The file handler classes DTAFileCSV, DTAFileTSV, DTAFileDelim and
      DTAFileAny shall each carry the properties their format needs, and
      DTAFileFactory() shall build the one its type names.
    risk: high
    category: interface
    covers: [DTAFile, DTAFileTabular, DTAFileCSV, DTAFileTSV, DTAFileDelim, DTAFileAny, DTAFileFactory]
    source: R/DTAFile-class.R

  - id: REQ-SPEC-012
    text: >
      DTAMetaData() shall carry the transfer's descriptive and contractual
      metadata, and DTARule shall be the common class of every rule type.
    risk: medium
    category: interface
    covers: [DTAMetaData, DTARule]
    source: R/DTAMetaData-class.R

  - id: REQ-SPEC-013
    text: >
      Each factory shall reject a type it does not recognise, naming what it
      accepts.
    risk: medium
    category: interface
    covers: [DTADataSetFactory, DTAFileFactory, DTAColumnSpecStructureFactory]
    source: R/DTADataSet-class.R

  # ---- writing a specification back --------------------------------------------

  - id: REQ-SPEC-014
    text: >
      A column specification collection written to YAML and read back shall
      describe the same columns, with the same types, lengths, nullability,
      permitted values and patterns.
    risk: high
    category: integrity
    covers: [write_columns_to_yaml, import_specs_from_yaml]
    source: R/DTAColumnSpecCollection-class.R

  - id: REQ-SPEC-015
    text: >
      A column specification collection written to JSON shall parse as JSON and
      describe the same columns.
    risk: medium
    category: integrity
    covers: [write_columns_to_json]
    source: R/DTAColumnSpecCollection-class.R

  # ---- the JSON schema view ------------------------------------------------------

  - id: REQ-SPEC-016
    text: >
      as_json_schema() shall render a column specification as a JSON Schema
      fragment, with as_json_schema_type() and as_json_schema_length()
      contributing the declared type and length.
    risk: medium
    category: interface
    covers: [as_json_schema, as_json_schema_type, as_json_schema_length]
    source: R/DTAColumnSpec-class.R

  - id: REQ-SPEC-017
    text: >
      A nullable column shall admit the null type in its schema, and a
      non-nullable column shall not.
    risk: high
    category: functional
    covers: [as_json_schema_type]
    source: R/DTAColumnSpec-class.R

  # ---- accessors ------------------------------------------------------------------

  - id: REQ-SPEC-018
    text: >
      datasets(), files(), specs(), tables(), rules() and metadata() shall each
      return the corresponding part of a transfer object.
    risk: medium
    category: interface
    covers: [datasets, files, specs, tables, rules, metadata]
    source: R/DTA-class.R

  - id: REQ-SPEC-019
    text: >
      columns(), labels(), names() and colspec() shall report a specification's
      column identifiers, their labels, and the specification of a named
      column.
    risk: medium
    category: interface
    covers: [columns, labels, names, colspec]
    source: R/DTA-class.R

  - id: REQ-SPEC-020
    text: >
      get_table() shall return a loaded table by name or by position, and shall
      raise a condition for a name or position that does not exist.
    risk: medium
    category: interface
    covers: [get_table]
    source: R/DTADataSetTabular-class.R

  - id: REQ-SPEC-021
    text: >
      column_preview() shall summarise a specification's columns without
      loading any data.
    risk: low
    category: interface
    covers: [column_preview]
    source: R/DTADataSetTabular-class.R

  - id: REQ-SPEC-022
    text: >
      print(), print_info() and print_short_info() shall describe an object
      without altering it.
    risk: low
    category: interface
    covers: [print, print_info, print_short_info]
    source: R/DTA-class.R

  # ---- the shipped examples --------------------------------------------------------

  - id: REQ-SPEC-023
    text: >
      Every create_example_ constructor shipped with the package shall build a
      valid object of the class it names.
    risk: medium
    category: documentation
    covers:
      - create_example_DTA
      - create_example_DTAColumnSpec
      - create_example_DTAColumnSpecCollection
      - create_example_DTADataSetTabular
      - create_example_DTAFileCSV
      - create_example_DTAFileTSV
      - create_example_DTAMetaData
      - create_example_DTARuleColCondition
      - create_example_DTARuleColRange
      - create_example_DTARuleColUnique
    source: R/DTA-class.R
    notes: >
      These are what a new user meets first, in every help page's examples. One
      that does not build makes the documentation wrong in the place a reader
      is most likely to trust it.
