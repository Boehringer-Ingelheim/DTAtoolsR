area: REPORT
title: The standalone HTML validation report

# write_validation_report() is meant to be read on a validated system with no
# internet access, by someone who was not in the room when the transfer was
# checked. Two things follow from that: the file has to be everything it
# claims to be with nothing fetched at render time, and it has to say what
# check() actually found -- a report that quietly drops a finding is worse
# than no report, because it reads as a clean bill of health.

requirements:
  # ---- standalone -------------------------------------------------------------

  - id: REQ-REPORT-001
    text: >
      write_validation_report() shall produce a document that references
      nothing over the network: no <script src>, <link href> or <img src>
      pointing at a URL. CSS and JavaScript shall be embedded inline.
    risk: high
    category: integrity
    covers: [write_validation_report]
    source: R/exportValidationReport.R
    notes: >
      Load-bearing for a validated-system reader: a report that reaches for
      the network renders differently, or not at all, depending on what the
      opening machine can reach, which defeats the point of a standalone
      artifact.

  # ---- the overview -------------------------------------------------------------

  - id: REQ-REPORT-002
    text: >
      The overview's pass/fail/pending counts shall agree with results(),
      together with the metadata row REQ-REPORT-003 requires: a target counts
      as passed when its status is "validated", failed when its status is
      "failed", and pending for every other status (skipped, not_validated,
      unspecified).
    risk: high
    category: functional
    covers: [write_validation_report, results]
    source: R/reportRendering.R .report_summary_html(), .report_status_label()

  - id: REQ-REPORT-003
    text: >
      The overview shall reflect the metadata axis of the verdict. A transfer
      that is invalid only because of a metadata import error shall show that
      failure in the overview's counts and in its per-target table, not solely
      as a message row further down the document.
    risk: high
    category: functional
    covers: [write_validation_report, results]
    source: R/exportValidationReport.R, R/reportRendering.R
    notes: >
      results(DTA) iterates x@datasets and emits no row for metadata: check()
      computes a metadata verdict but keeps it on the object rather than in
      that frame. The report therefore adds one row for the metadata axis
      itself, when and only when metadata carries import errors, so that the
      overview cannot say every target passed while the transfer's own verdict
      says the delivery is invalid. A clean transfer's overview is unchanged
      and remains a statement about its targets. Was DEV-013's sibling defect
      DEV-011 until the row was added.

  # ---- messages and inspect panels ---------------------------------------------

  - id: REQ-REPORT-004
    text: >
      The document shall carry exactly one message-table row per row of
      messages(x), including rows hidden by the max_repeats cap (they are
      hidden with a "show more" toggle, not omitted from the document).
    risk: high
    category: functional
    covers: [write_validation_report, messages]
    source: R/reportRendering.R .report_messages_table_html()

  - id: REQ-REPORT-005
    text: >
      The document shall carry exactly one inspect detail panel per row of
      messages(x), identified by that message's own id.
    risk: medium
    category: functional
    covers: [write_validation_report, messages]
    source: R/reportRendering.R .report_inspect_panel_html()

  - id: REQ-REPORT-006
    text: >
      A metadata import error present anywhere in the transfer shall not
      degrade the inspect detail available for any other message in the
      document.
    risk: high
    category: functional
    covers: [write_validation_report, inspect]
    source: R/exportValidationReport.R, R/validationReporting.R
    notes: >
      write_validation_report() fetches inspect() detail for every message
      with ONE batched call, inspect(x, id = messages(x)$id). inspect(DTA)
      answers a metadata message (dataset = NA, target "metadata") from the
      metadata's import issues, as an import record, so the batch succeeds. If
      the batch still fails, the report retries once per dataset group (the
      metadata group on its own), so a failure loses only that group's
      detail; a message left without detail says so in its panel, which keeps
      the inspect-badge-unknown class.

  - id: REQ-REPORT-007
    text: >
      max_repeats shall cap identical repeated messages (same
      dataset/target/source/rule/column/keyword/message, differing only by
      row) at that many visible rows, hiding the rest behind a "show more"
      toggle; NULL or Inf shall disable capping; a value that is not a
      positive whole number shall be rejected.
    risk: medium
    category: functional
    covers: [write_validation_report]
    source: R/reportRendering.R .report_messages_table_html()

  # ---- multiple datasets, unchecked datasets, clean transfers -------------------

  - id: REQ-REPORT-008
    text: >
      A transfer of several datasets shall contribute one overview row per
      dataset target, and the messages table shall carry every dataset's
      messages together.
    risk: medium
    category: functional
    covers: [write_validation_report]
    source: R/exportValidationReport.R

  - id: REQ-REPORT-009
    text: >
      A dataset that was never checked shall appear in the overview as
      pending, not be silently omitted from the document.
    risk: high
    category: functional
    covers: [write_validation_report, results]
    source: R/reportRendering.R .report_status_label()

  - id: REQ-REPORT-010
    text: >
      A transfer with no validation failures shall show zero failed in the
      overview and zero message-table rows.
    risk: medium
    category: functional
    covers: [write_validation_report]
    source: R/exportValidationReport.R

  # ---- file handling and its arguments -------------------------------------------

  - id: REQ-REPORT-011
    text: >
      write_validation_report() shall not replace an existing file unless
      overwrite = TRUE, and quiet = TRUE shall suppress only its success
      message, never the file being written.
    risk: medium
    category: functional
    covers: [write_validation_report]
    source: R/exportValidationReport.R

  - id: REQ-REPORT-012
    text: >
      The report's title shall be the explicit title argument when supplied;
      otherwise the DTA's metadata title when one is set; otherwise
      "Validation Report". A title of NA is treated as not supplied.
    risk: low
    category: functional
    covers: [write_validation_report, metadata]
    source: R/exportValidationReport.R

  - id: REQ-REPORT-013
    text: >
      The document header shall show the generation timestamp.
    risk: low
    category: functional
    covers: [write_validation_report]
    source: R/exportValidationReport.R

  - id: REQ-REPORT-014
    text: >
      write_validation_report() shall reject an x that is not a DTA object,
      and a title that is not NULL and not a single character string, each
      with a condition naming the offending argument.
    risk: medium
    category: interface
    covers: [write_validation_report]
    source: R/exportValidationReport.R
