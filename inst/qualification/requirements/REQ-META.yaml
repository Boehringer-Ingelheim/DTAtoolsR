area: META
title: Transfer metadata

# DTAMetaData is the only part of a transfer that describes the AGREEMENT
# rather than the data: who is sending what to whom, on what dates, under
# whose authority to request a correction. None of it is checked against a
# column specification, so a defect here is invisible to the three validation
# axes and would otherwise reach a signed document unnoticed.

requirements:
  # ---- the validator ----------------------------------------------------------

  - id: REQ-META-001
    text: >
      title and version, when supplied, shall not be an empty string.
    risk: medium
    category: functional
    covers: [DTAMetaData]
    source: R/DTAMetaData-class.R validator()

  - id: REQ-META-002
    text: >
      Each version_history record shall be a list carrying version, date and
      changes; a record that is not a list, or omits any of the three fields,
      shall be rejected naming the missing field(s).
    risk: medium
    category: functional
    covers: [DTAMetaData]
    source: R/DTAMetaData-class.R validator()

  - id: REQ-META-003
    text: >
      A version_history record's changes shall be one or more change
      descriptions (a character vector or a list of strings); an empty
      collection, an empty string or an NA entry shall be rejected.
    risk: low
    category: functional
    covers: [DTAMetaData]
    source: R/DTAMetaData-class.R validator()

  - id: REQ-META-004
    text: >
      transmission$date_first_transfer and transmission$date_last_transfer,
      when present, shall each be a Date or a character string; any other type
      shall be rejected.
    risk: medium
    category: functional
    covers: [DTAMetaData]
    source: R/DTAMetaData-class.R validator()

  - id: REQ-META-005
    text: >
      template, when non-empty, shall carry id and version each as a single
      non-empty character string, so that a partially written provenance
      record cannot reach the rebase feature that trusts it.
    risk: medium
    category: integrity
    covers: [DTAMetaData]
    source: R/DTAMetaData-class.R validator()

  # ---- date parsing -----------------------------------------------------------

  - id: REQ-META-006
    text: >
      A date-valued field supplied as a string that is exactly an ISO date
      (YYYY-MM-DD) shall become a Date, and shall record no import issue.
    risk: high
    category: functional
    covers: [DTAMetaData]
    source: R/DTAMetaData-class.R .parse_metadata_date()

  - id: REQ-META-007
    text: >
      A date-valued field supplied as a string that starts with an ISO date but
      carries trailing text shall still become a Date, and shall record one
      import issue carrying the field path, the original string verbatim, the
      declared type and the reason "trailing_residue".
    risk: high
    category: integrity
    covers: [DTAMetaData, metadata_import_errors]
    source: R/DTAMetaData-class.R .parse_metadata_date()
    notes: >
      This is the dangerous case the whole mechanism exists for: as.Date()
      alone would silently discard "at the earliest" or "pending signature"
      from a data transfer agreement and leave a plain committed date behind.
      Recording the loss as an import issue is what makes check() on the
      enclosing DTA fail instead of passing over a qualified date as if it
      were unconditional.

  - id: REQ-META-008
    text: >
      A transmission date supplied as a string with no leading ISO date (a
      free-text phrase such as "2 weeks after approval") shall be kept
      verbatim as character, and shall record no import issue.
    risk: medium
    category: functional
    covers: [DTAMetaData]
    source: R/DTAMetaData-class.R .parse_metadata_date()

  - id: REQ-META-009
    text: >
      The top-level date property is typed Date and cannot hold a free-text
      phrase. A string with no leading ISO date supplied there shall be
      coerced to NA, the same coercion as.Date() would perform, and shall
      record an import issue naming the field "date" with reason
      "not_convertible" and carrying the original string verbatim, so that
      the loss is never silent.
    risk: high
    category: functional
    covers: [DTAMetaData]
    source: R/DTAMetaData-class.R .parse_metadata_date()
    notes: >
      Closes DEV-009. .parse_metadata_date() is documented as keeping a
      dateless phrase "verbatim as character", and that is true for
      transmission$date_first_transfer/date_last_transfer (require_date =
      FALSE), but the top-level date= argument is parsed with require_date =
      TRUE, whose branch runs the whole original string through
      as.Date(value, format = "\%Y-\%m-\%d") and stores whatever that returns
      -- NA for anything that is not itself an ISO date -- and now also
      records an import issue for that loss, unlike the free-text
      transmission fields, where a dateless phrase is legitimate input and no
      issue is recorded.

  # ---- validate_transmission_dates() ------------------------------------------

  - id: REQ-META-010
    text: >
      validate_transmission_dates() shall return a list with is_valid
      (logical) and messages (character). Absent transmission data, or a
      first-transfer date no later than the last-transfer date, shall report
      is_valid = TRUE; a first-transfer Date later than the last-transfer Date
      shall report is_valid = FALSE with a message naming the problem.
    risk: high
    category: functional
    covers: [validate_transmission_dates]
    source: R/DTAMetaData-helpers.R

  # ---- accessors ---------------------------------------------------------------

  - id: REQ-META-011
    text: >
      get_version_history_df() shall return a data.frame with exactly the
      columns version, date and changes, one row per version_history record.
      Each record's date shall be normalised to a Date whether it was
      originally a Date, a character string (as loaded from YAML), or absent;
      an empty version_history shall return a correctly typed zero-row frame.
    risk: medium
    category: interface
    covers: [get_version_history_df]
    source: R/DTAMetaData-helpers.R

  - id: REQ-META-012
    text: >
      get_authorized_for_corrections() shall return the
      authorized_for_corrections property verbatim, in whatever shape it was
      supplied (character vector, list, or NULL).
    risk: low
    category: interface
    covers: [get_authorized_for_corrections]
    source: R/DTAMetaData-helpers.R

  - id: REQ-META-013
    text: >
      get_receiver_reviewers() shall return the receiver contacts whose
      reviewer flag is TRUE: names only when name_only = TRUE (the default),
      full contact records when name_only = FALSE, and NULL when there is no
      receiver or no contacts.
    risk: medium
    category: interface
    covers: [get_receiver_reviewers]
    source: R/DTAMetaData-helpers.R

  - id: REQ-META-014
    text: >
      get_transmission_dates() shall return a list with first_transfer and
      last_transfer, each carrying the transmission date verbatim (Date or
      character), or both NULL when there is no transmission data.
    risk: low
    category: interface
    covers: [get_transmission_dates]
    source: R/DTAMetaData-helpers.R

  - id: REQ-META-015
    text: >
      metadata_import_errors() shall return one row per import issue with the
      columns row (always NA, metadata has no rows), column (the metadata
      field path), raw, declared_type and reason, and zero rows when nothing
      was coerced.
    risk: high
    category: interface
    covers: [metadata_import_errors]
    source: R/DTAMetaData-helpers.R

  - id: REQ-META-016
    text: >
      messages() on a DTAMetaData object shall return one row per import issue
      in the same ten-column shape as a table's messages, with source
      "import", target "metadata" and dataset NA.
    risk: medium
    category: interface
    covers: [messages]
    source: R/DTAMetaData-helpers.R dta_metadata_messages_to_df()

  # ---- YAML round trip ----------------------------------------------------------

  - id: REQ-META-017
    text: >
      Every metadata key the specification accepts (title, version, date,
      header, version_history, receiver, supplier, transmission,
      error_handling, authorized_for_corrections, template, study, sections) shall survive
      being written to YAML and read back into an equivalent DTAMetaData
      object. A Date-valued field shall be written as an ISO date string, not
      as its underlying numeric day count. import_issues is derived, not
      author-supplied, and shall never itself be written.
    risk: high
    category: integrity
    covers: [DTAMetaData]
    source: R/DTAMetaData-helpers.R .date_to_iso(), as.list(DTAMetaData)

  - id: REQ-META-018
    text: >
      An import issue recorded on a date-valued metadata field (a
      trailing_residue on the top-level date or a transmission date, or a
      not_convertible top-level date) shall survive a write and a read. The
      original text shall be written in place of the resolved Date, so that
      reading the file back reproduces the same issue with the same raw text.
      This applies only while the field still holds the value that text
      resolved to; a value changed after loading is written as itself and
      carries no issue.
    risk: high
    category: integrity
    covers: [DTAMetaData, metadata_import_errors]
    source: R/DTAMetaData-helpers.R as.list(DTAMetaData)
    notes: >
      Closes DEV-010. The constructor re-parses character dates on every
      construction, so writing the raw text back is enough for the reader to
      recreate the issue; import_issues itself is still never written.

  - id: REQ-META-019
    text: >
      DTAMetaData shall accept optional study metadata as a named list with
      id and protocol_id. Supplied identifiers shall be scalar, non-missing,
      nonblank character strings. Unknown, duplicate or unnamed fields and
      invalid identifier types shall be rejected. Study metadata shall not
      change the document header or a dataset's STUDYID constraints.
    risk: high
    category: functional
    covers: [DTAMetaData]
    source: R/DTAMetaData-class.R

  - id: REQ-META-020
    text: >
      DTAMetaData shall accept sections as an ordered named list with unique
      identifiers matching ^[A-Za-z][A-Za-z0-9_]*$. Each section shall contain
      exactly a scalar nonblank character title and scalar non-missing
      character text; empty text is permitted while drafting. Malformed
      section records and unknown fields shall be rejected. Stored order and
      paragraph breaks shall be retained.
    risk: high
    category: integrity
    covers: [DTAMetaData]
    source: R/DTAMetaData-class.R

  - id: REQ-META-021
    text: >
      The optional transmission fields extent, scope, packaging, security,
      checksum, test_requirements and blinding_requirements shall accept
      scalar non-missing character values, including empty draft text, and
      reject invalid types or lengths. Previously supported transmission
      fields and unknown extensions shall remain supported. These metadata
      statements shall not execute transfers, encryption, checksums or
      redaction.
    risk: medium
    category: functional
    covers: [DTAMetaData]
    source: R/DTAMetaData-class.R

  - id: REQ-META-022
    text: >
      Empty study and sections shall default to empty lists and be omitted
      from as.list and YAML output. Legacy constructor arguments shall
      retain their positional meanings. Nonempty study and sections shall
      survive serialization and reconstruction with their values, section
      order and multiline text unchanged.
    risk: high
    category: integrity
    covers: [DTAMetaData, read_dta_from_yaml]
    source: R/DTAMetaData-class.R; R/DTAMetaData-helpers.R
